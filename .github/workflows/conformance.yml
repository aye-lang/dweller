name: conformance

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            target/wpt
            target/test262
          key: conformance-${{ hashFiles('browser/tools/wpt.rev', 'browser/tools/test262.rev', 'browser/tools/wpt_areas.json') }}
      - uses: actions/cache@v4
        with:
          path: target/wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/wasm/wasmtime.lock', 'browser/wasm/fetch_wasmtime.sh') }}
      - run: sh scripts/setup-ubuntu.sh
      # the baselines are measured with libwasmtime: without it `WebAssembly` is
      # undefined and html/browsers/origin and content-security-policy fall
      - run: browser/wasm/fetch_wasmtime.sh
      - run: |
          git clone https://github.com/aye-lang/aye ../aye
          git -C ../aye checkout "$(cat AYE_REV)"
          cargo build --release --manifest-path ../aye/Cargo.toml
          echo "AYE=$PWD/../aye/target/release/aye" >> "$GITHUB_ENV"
      - run: browser/build.sh
      - run: python3 browser/tools/wpt.py fetch && python3 browser/tools/test262.py fetch
      - run: python3 browser/tools/conformance.py run -j "$(nproc)"
      - run: python3 browser/tools/conformance.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: |
            target/wpt-results
            target/test262-results

  webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: target/webgl
          key: webgl-cts-${{ hashFiles('browser/tools/webgl_cts.rev') }}
      - uses: actions/cache@v4
        with:
          path: target/angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/gpu/angle.lock') }}
      - uses: actions/cache@v4
        with:
          path: target/wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/wasm/wasmtime.lock', 'browser/wasm/fetch_wasmtime.sh') }}
      - run: sh scripts/setup-ubuntu.sh
      - run: browser/gpu/fetch_angle.sh
      # without libwasmtime `WebAssembly` is undefined and conformance2/wasm falls (Q0.1)
      - run: browser/wasm/fetch_wasmtime.sh
      - run: |
          git clone https://github.com/aye-lang/aye ../aye
          git -C ../aye checkout "$(cat AYE_REV)"
          cargo build --release --manifest-path ../aye/Cargo.toml
          echo "AYE=$PWD/../aye/target/release/aye" >> "$GITHUB_ENV"
      - run: browser/build.sh
      - run: python3 browser/tools/webgl_conformance.py fetch
      - run: python3 browser/tools/webgl_conformance.py run conformance2 conformance -j "$(nproc)"
      - run: python3 browser/tools/webgl_conformance.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-conformance-results
          path: target/webgl-results

  # DV6: the CI cells of the scoreboard in the run summary. It pushes nothing.
  scoreboard:
    needs: [conformance, webgl]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: conformance-results
          path: target
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: webgl-conformance-results
          path: target/webgl-results
      - run: python3 browser/tools/scoreboard.py summary >> "$GITHUB_STEP_SUMMARY"
