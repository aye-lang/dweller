name: single-mode

# The debugging mode as a number (Q2.14): since the flip the suite runs
# with a renderer per site, and this run keeps the window's own process
# (DWELLER_PROCESS=single, Chromium's --single-process) whole: passed over
# total and the failing names. Not a required check. Failing tests are the
# measurement: the run is red only when the build breaks or a shard does
# not finish.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  SHARDS: 4

jobs:
  shard:
    name: single (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (Ubuntu)
        run: sh scripts/setup-ubuntu.sh

      - name: Cache ANGLE
        uses: actions/cache@v4
        with:
          path: target/angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/gpu/angle.lock') }}

      - name: Fetch ANGLE
        run: |
          if grep -q '^[0-9a-f]\{64\}  ' browser/gpu/angle.lock; then
            browser/gpu/fetch_angle.sh
          else
            echo "::notice::browser/gpu/angle.lock has no hashes yet; ANGLE not fetched"
          fi

      - name: Cache wasmtime
        uses: actions/cache@v4
        with:
          path: target/wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/wasm/wasmtime.lock', 'browser/wasm/fetch_wasmtime.sh') }}

      - name: Fetch wasmtime
        run: |
          pc="$(browser/wasm/fetch_wasmtime.sh)"
          echo "PKG_CONFIG_PATH=$pc" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the pinned aye
        id: aye-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aye
          key: aye-${{ runner.os }}-${{ hashFiles('AYE_REV') }}

      - name: Install the pinned aye
        if: steps.aye-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/aye-lang/aye --rev "$(cat AYE_REV)" --locked aye

      - name: cargo test --release --test browser, DWELLER_PROCESS=single
        env:
          DWELLER_PROCESS: single
        run: .github/scripts/mode-shard.sh run ${{ matrix.shard }} "$SHARDS"

      - uses: actions/upload-artifact@v4
        with:
          name: single-mode-${{ matrix.shard }}
          path: |
            target/mode-run/ok.txt
            target/mode-run/failed.txt
          retention-days: 30

  count:
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: single-mode-*
          path: target/mode-run-shards

      - name: Passed over total
        run: DWELLER_PROCESS=single .github/scripts/mode-shard.sh summary "$SHARDS" target/mode-run-shards | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Every shard finished
        env:
          RESULT: ${{ needs.shard.result }}
        run: test "$RESULT" = success
