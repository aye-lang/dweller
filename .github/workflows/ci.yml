name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (Ubuntu)
        if: runner.os == 'Linux'
        run: sh scripts/setup-ubuntu.sh

      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 freetype harfbuzz brotli pkgconf

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the pinned aye
        id: aye-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aye
          key: aye-${{ runner.os }}-${{ hashFiles('AYE_REV') }}

      # aye-lang/aye is private: the AYE_TOKEN secret (a token that can read
      # it) is put into the clone URL through git's insteadOf, so the token
      # is not recorded in cargo's install metadata.
      - name: Install the pinned aye
        if: steps.aye-cache.outputs.cache-hit != 'true'
        env:
          AYE_TOKEN: ${{ secrets.AYE_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          git config --global url."https://x-access-token:${AYE_TOKEN}@github.com/aye-lang/aye".insteadOf https://github.com/aye-lang/aye
          cargo install --git https://github.com/aye-lang/aye --rev "$(cat AYE_REV)" --locked aye
          git config --global --unset-all url."https://x-access-token:${AYE_TOKEN}@github.com/aye-lang/aye".insteadOf

      - name: aye check browser
        run: aye check browser

      - name: aye test browser
        run: aye test browser

      - name: cargo test --release --test browser
        run: AYE="$(command -v aye)" cargo test --release --test browser
