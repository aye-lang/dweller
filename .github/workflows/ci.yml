name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so that adding the `macos` label starts a run with the
    # macOS shards and `perf` (DV1). Any label starts a new run.
    types: [opened, synchronize, reopened, labeled]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # DV3: lists the changed files. `code` is false only when every changed
  # file is under docs/ or ends in .md; then the shards and `perf` are
  # skipped and the required checks `browser` and `perf` still report. If
  # this job fails, `browser` fails (and `perf` where it runs), and an unset
  # `code` counts as true (fail closed). The plan check runs here, so a
  # docs-only change is still checked.
  changes:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # On pull_request the checkout is the test merge commit: its first
      # parent is the base it was merged onto, so depth 2 is enough. On
      # merge_group the base of the queue entry is fetched by its sha.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: List the changed files
        env:
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$EVENT" in
            pull_request)
              test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
              base=HEAD^1 head=HEAD ;;
            merge_group)
              git fetch --no-tags --depth=1 origin "$QUEUE_BASE"
              base="$QUEUE_BASE" head="$QUEUE_HEAD" ;;
            *)
              exit 1 ;;
          esac
          git diff --no-renames --name-only "$base" "$head" > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"

      - name: Classify
        id: classify
        run: |
          code="$(awk '!/^docs\// && !/\.md$/ { code = 1 } END { print ((NR == 0 || code) ? "true" : "false") }' "$RUNNER_TEMP/changed-files.txt")"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

      - name: Plan one-home rule
        run: python3 browser/tools/check_plan.py

  # DV1: macOS runs only where it decides. A pull request runs the four
  # Ubuntu shards; the two macOS shards run in the merge queue, or on a pull
  # request with the label `macos`. A push to main runs only `caches`: the
  # merge queue already tested that tree.
  browser-shard:
    name: browser (${{ matrix.os }}, ${{ matrix.part }})
    needs: changes
    # `!cancelled()` so that the shards still run when `changes` failed after
    # it set `code` (the plan check), or before (`code` empty).
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(format('[{0}{1}]',
          (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos')) &&
          '{"os":"macos-latest","shard":0,"shards":2,"part":"1/2"},
          {"os":"macos-latest","shard":1,"shards":2,"part":"2/2"},' || '',
          '{"os":"ubuntu-24.04","shard":0,"shards":4,"part":"1/4"},
          {"os":"ubuntu-24.04","shard":1,"shards":4,"part":"2/4"},
          {"os":"ubuntu-24.04","shard":2,"shards":4,"part":"3/4"},
          {"os":"ubuntu-24.04","shard":3,"shards":4,"part":"4/4"}')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Code taste
        if: runner.os == 'Linux' && matrix.shard == 0
        run: python3 browser/tools/check_taste.py

      - name: CSS property ids
        if: runner.os == 'Linux' && matrix.shard == 0
        run: python3 browser/tools/gen_property_ids.py --check

      - name: Install system packages (Ubuntu)
        if: runner.os == 'Linux'
        run: sh scripts/setup-ubuntu.sh

      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 freetype harfbuzz brotli pkgconf

      - name: Cache ANGLE
        uses: actions/cache@v4
        with:
          path: target/angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/gpu/angle.lock') }}

      - name: Fetch ANGLE
        run: |
          if grep -q '^[0-9a-f]\{64\}  ' browser/gpu/angle.lock; then
            browser/gpu/fetch_angle.sh
          else
            echo "::notice::browser/gpu/angle.lock has no hashes yet; ANGLE not fetched"
          fi

      - name: Cache wasmtime
        uses: actions/cache@v4
        with:
          path: target/wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/wasm/wasmtime.lock', 'browser/wasm/fetch_wasmtime.sh') }}

      - name: Fetch wasmtime
        run: |
          pc="$(browser/wasm/fetch_wasmtime.sh)"
          echo "PKG_CONFIG_PATH=$pc" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the pinned aye
        id: aye-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aye
          key: aye-${{ runner.os }}-${{ hashFiles('AYE_REV') }}

      - name: Install the pinned aye
        if: steps.aye-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/aye-lang/aye --rev "$(cat AYE_REV)" --locked aye

      - name: Module layers
        if: matrix.shard == 0
        run: python3 browser/tools/check_layers.py

      - name: aye check browser
        if: matrix.shard == 0
        run: aye check browser

      - name: Smoke the shipped build
        if: runner.os == 'Linux' && matrix.shard == 0
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          browser/build.sh target/dweller-shipped
          test -f target/dweller-shipped.safe
          target/dweller-shipped dump --tree browser/tests/article.html > /dev/null
          target/dweller-shipped dump --layout browser/tests/basic.html > /dev/null
          target/dweller-shipped --frames 30 browser/tests/article.html

      - name: cargo test --release --test browser
        run: .github/scripts/browser-shard.sh ${{ matrix.shard }} ${{ matrix.shards }}

      - name: Upload flaky test names
        if: hashFiles('target/flaky-tests.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: flaky-tests-${{ matrix.os }}-${{ matrix.shard }}
          path: target/flaky-tests.txt

      - name: File flaky test issues
        if: hashFiles('target/flaky-tests.txt') != '' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create flaky --force --color B60205 --description "failed, then passed on re-run"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for name in $(cat target/flaky-tests.txt); do
            number="$(gh issue list --search "in:title \"flaky: $name\"" --state open --json number,title --jq ".[] | select(.title == \"flaky: $name\") | .number" | head -n 1)"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "Failed, then passed on re-run ($RUNNER_OS): $run_url"
            else
              gh issue create --title "flaky: $name" --label flaky --body "Failed, then passed on re-run ($RUNNER_OS): $run_url"
            fi
          done

  browser:
    needs: [changes, browser-shard]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      # The shards may be skipped only when `changes` passed and said the
      # change is docs only.
      - name: Every browser shard passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.browser-shard.result }}
        run: |
          echo "changes=$CHANGES code=$CODE shards=$SHARDS"
          test "$CHANGES" = success
          if [ "$CODE" = false ]; then test "$SHARDS" = skipped; else test "$SHARDS" = success; fi

  # A job skipped by its `if` reports success, so the required check `perf`
  # passes on a pull request without the `macos` label, and on a docs-only
  # change (DV3). If `changes` failed, `perf` (in the queue, or with the label)
  # runs and fails at its first step.
  perf:
    needs: changes
    if: >-
      ${{ !cancelled() &&
      (github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'macos')) &&
      (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: The change list passed
        env:
          CHANGES: ${{ needs.changes.result }}
        run: test "$CHANGES" = success

      - uses: actions/checkout@v4

      - name: Install system packages
        run: brew install sdl2 freetype harfbuzz brotli pkgconf

      - name: Cache ANGLE
        uses: actions/cache@v4
        with:
          path: target/angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/gpu/angle.lock') }}

      - name: Fetch ANGLE
        run: |
          if grep -q '^[0-9a-f]\{64\}  ' browser/gpu/angle.lock; then
            browser/gpu/fetch_angle.sh
          else
            echo "::notice::browser/gpu/angle.lock has no hashes yet; ANGLE not fetched"
          fi

      - name: Cache wasmtime
        uses: actions/cache@v4
        with:
          path: target/wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/wasm/wasmtime.lock', 'browser/wasm/fetch_wasmtime.sh') }}

      - name: Fetch wasmtime
        run: |
          pc="$(browser/wasm/fetch_wasmtime.sh)"
          echo "PKG_CONFIG_PATH=$pc" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the pinned aye
        id: aye-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aye
          key: aye-${{ runner.os }}-${{ hashFiles('AYE_REV') }}

      - name: Install the pinned aye
        if: steps.aye-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/aye-lang/aye --rev "$(cat AYE_REV)" --locked aye

      - name: Build the browser
        run: aye build browser -o target/dweller

      - name: Perf gate
        run: python3 browser/tools/window_perf.py gate browser/tests/perf/budgets.json --binary target/dweller

  # On a push to main, only fill the caches that pull requests and the merge
  # queue restore: a run can restore caches of its own branch and of main,
  # and caches saved by a merge-queue run stay on its temporary branch.
  # On a cache hit every step is a no-op.
  caches:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache the pinned aye
        id: aye-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aye
          key: aye-${{ runner.os }}-${{ hashFiles('AYE_REV') }}

      - name: Install system packages (Ubuntu)
        if: runner.os == 'Linux' && steps.aye-cache.outputs.cache-hit != 'true'
        run: sh scripts/setup-ubuntu.sh

      - name: Install system packages (macOS)
        if: runner.os == 'macOS' && steps.aye-cache.outputs.cache-hit != 'true'
        run: brew install sdl2 freetype harfbuzz brotli pkgconf

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the pinned aye
        if: steps.aye-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/aye-lang/aye --rev "$(cat AYE_REV)" --locked aye

      - name: Cache ANGLE
        uses: actions/cache@v4
        with:
          path: target/angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/gpu/angle.lock') }}

      - name: Fetch ANGLE
        run: |
          if grep -q '^[0-9a-f]\{64\}  ' browser/gpu/angle.lock; then
            browser/gpu/fetch_angle.sh
          else
            echo "::notice::browser/gpu/angle.lock has no hashes yet; ANGLE not fetched"
          fi

      - name: Cache wasmtime
        uses: actions/cache@v4
        with:
          path: target/wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/wasm/wasmtime.lock', 'browser/wasm/fetch_wasmtime.sh') }}

      - name: Fetch wasmtime
        run: browser/wasm/fetch_wasmtime.sh
