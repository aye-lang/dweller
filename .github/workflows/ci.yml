name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (Ubuntu)
        if: runner.os == 'Linux'
        run: sh scripts/setup-ubuntu.sh

      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 freetype harfbuzz brotli pkgconf

      - name: Cache ANGLE
        uses: actions/cache@v4
        with:
          path: target/angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/gpu/angle.lock') }}

      - name: Fetch ANGLE
        run: |
          if grep -q '^[0-9a-f]\{64\}  ' browser/gpu/angle.lock; then
            browser/gpu/fetch_angle.sh
          else
            echo "::notice::browser/gpu/angle.lock has no hashes yet; ANGLE not fetched"
          fi

      - name: Cache wasmtime
        uses: actions/cache@v4
        with:
          path: target/wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser/wasm/wasmtime.lock', 'browser/wasm/fetch_wasmtime.sh') }}

      - name: Fetch wasmtime
        run: |
          pc="$(browser/wasm/fetch_wasmtime.sh)"
          echo "PKG_CONFIG_PATH=$pc" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the pinned aye
        id: aye-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aye
          key: aye-${{ runner.os }}-${{ hashFiles('AYE_REV') }}

      - name: Install the pinned aye
        if: steps.aye-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/aye-lang/aye --rev "$(cat AYE_REV)" --locked aye

      - name: aye check browser
        run: aye check browser

      - name: aye test browser
        run: aye test browser

      - name: cargo test --release --test browser
        run: AYE="$(command -v aye)" cargo test --release --test browser
