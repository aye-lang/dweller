<!DOCTYPE html>
<title>A javascript: link</title>
<pre id="out"></pre>
<a id="go" href="javascript:document.getElementById('out').textContent += 'the link ran\n'">go</a>
<script>
document.getElementById('go').click();
setTimeout(() => { document.getElementById('out').textContent += 'done\n'; }, 100);
</script>
