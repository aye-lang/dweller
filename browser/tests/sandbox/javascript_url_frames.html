<!DOCTYPE html>
<title>javascript: URLs of frames and of a popup's own location</title>
<pre id="out"></pre>
<iframe id="src" src="javascript:'<p>from the src</p>'"></iframe>
<iframe id="self" srcdoc="<script>location.href = &quot;javascript:'<b>navigated itself</b>'&quot;</script>"></iframe>
<script>
const out = document.getElementById('out');
const log = (line) => { out.textContent += line + '\n'; };
let ran = '';
addEventListener('message', (e) => { ran = e.data; });
window.open('javascript_url_self.html', 'self');
const body = (id) => document.getElementById(id).contentDocument.body.textContent;
let tries = 0;
const check = () => {
  if ((ran && body('src') && body('self')) || ++tries > 40) {
    log(ran);
    log('src frame: ' + body('src'));
    log('self frame: ' + body('self'));
    log('done');
    return;
  }
  setTimeout(check, 50);
};
setTimeout(check, 50);
</script>
