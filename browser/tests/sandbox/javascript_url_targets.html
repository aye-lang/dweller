<!DOCTYPE html>
<title>javascript: URLs of links with a target and of window.open into a frame</title>
<pre id="out"></pre>
<iframe name="same" src="blank.html"></iframe>
<iframe name="other"></iframe>
<a id="to-same" target="same" href="javascript:parent.postMessage('link into a frame: ' + location.pathname, '*')">same</a>
<a id="to-other" target="other" href="javascript:parent.postMessage('link into another origin', '*')">other</a>
<a id="to-tab" target="tab" href="javascript:opener.postMessage('link into a tab: ' + location.pathname, '*')">tab</a>
<a id="to-far" target="far" href="javascript:opener.postMessage('link into a tab of another origin', '*')">far</a>
<script>
const out = document.getElementById('out');
const lines = [];
const far = 'http://localhost:' + location.port + '/sandbox/blank.html';
addEventListener('message', (e) => lines.push(e.data));
document.querySelector('iframe[name=other]').src = far;
window.open('blank.html', 'tab');
window.open(far, 'far');
onload = () => setTimeout(() => {
  for (const id of ['to-same', 'to-other', 'to-tab', 'to-far']) document.getElementById(id).click();
  window.open("javascript:parent.postMessage('open into a frame: ' + location.pathname, '*')", 'same');
  window.open("javascript:parent.postMessage('open into another origin', '*')", 'other');
  setTimeout(() => { out.textContent = lines.sort().join('\n') + '\ndone\n'; }, 500);
}, 300);
</script>
