<!doctype html>
<meta name="color-scheme" content="light dark">
<style>
#report { color: rgb(0, 0, 1) }
@media (prefers-color-scheme: dark) { #report { color: rgb(0, 0, 2) } }
</style>
<p id="report"></p>
<script>
addEventListener('load', () => { document.getElementById('report').textContent = 'prefers dark ' + matchMedia('(prefers-color-scheme: dark)').matches; });
</script>
