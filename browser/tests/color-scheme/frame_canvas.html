<!doctype html>
<title>a frame's canvas is opaque only when its color scheme differs from its element's</title>
<style>
body { margin: 0; background: rgb(0, 128, 0) }
iframe { border: 0; width: 50px; height: 50px; position: absolute; top: 0 }
</style>
<iframe src="frame_canvas_plain.html" style="left: 0"></iframe>
<iframe src="frame_canvas_dark.html" style="left: 60px"></iframe>
<iframe src="frame_canvas_tinted.html" style="left: 120px"></iframe>
<iframe src="frame_canvas_plain.html" style="left: 180px; color-scheme: dark"></iframe>
