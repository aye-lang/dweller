<!doctype html>
<title>Up and Down in contenteditable</title>
<style>
body { margin: 0 }
#host { position: absolute; left: 10px; top: 10px; width: 300px; height: 100px; border: 1px solid gray; font-size: 20px }
pre { position: absolute; top: 130px; left: 10px; margin: 0 }
</style>
<div id="host" contenteditable><div>abcdef</div><div>ghi</div><div>mnopqr</div></div>
<pre id="out"></pre>
<script>
const out = document.getElementById('out'), host = document.getElementById('host');
const sel = getSelection();
const where = () => (sel.focusNode.data || sel.focusNode.nodeName) + ' ' + sel.focusOffset;
host.addEventListener('mouseup', e => { out.textContent += 'caret ' + where() + '\n'; });
host.addEventListener('input', e => { out.textContent += host.textContent + ' at ' + where() + (sel.isCollapsed ? '' : ' selected ' + JSON.stringify(String(sel))) + '\n'; });
</script>
