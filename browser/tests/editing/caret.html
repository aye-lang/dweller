<!doctype html>
<title>the caret in contenteditable</title>
<style>
body { margin: 0 }
#host { position: absolute; left: 10px; top: 10px; width: 300px; height: 60px; border: 1px solid gray; font-size: 20px }
pre { position: absolute; top: 90px; left: 10px; margin: 0 }
</style>
<div id="host" contenteditable>hello   world</div>
<pre id="out"></pre>
<script>
const out = document.getElementById('out'), host = document.getElementById('host');
const sel = getSelection();
host.addEventListener('mouseup', e => { out.textContent += 'caret ' + sel.focusNode.nodeName + ' ' + sel.focusOffset + '\n'; });
host.addEventListener('input', e => { out.textContent += e.inputType + ' ' + host.innerHTML + '\n'; });
</script>
