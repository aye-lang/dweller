<!doctype html>
<title>typing in contenteditable</title>
<style>
body { margin: 0 }
#host { position: absolute; left: 10px; top: 10px; width: 200px; height: 60px; border: 1px solid gray }
pre { position: absolute; top: 90px; left: 10px; margin: 0 }
</style>
<div id="host" contenteditable>ab</div>
<pre id="out"></pre>
<script>
const out = document.getElementById('out'), host = document.getElementById('host');
host.addEventListener('focus', () => { out.textContent += 'focus ' + (document.activeElement === host) + '\n'; });
host.addEventListener('input', e => { out.textContent += e.inputType + ' ' + host.innerHTML + '\n'; });
</script>
