<!doctype html>
<title>selecting page text</title>
<style>
body { margin: 0 }
p { position: absolute; left: 10px; top: 10px; margin: 0; font-size: 20px }
pre { position: absolute; top: 60px; left: 10px; margin: 0 }
</style>
<p id="text">hello world again</p>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
let changes = 0;
document.addEventListener('selectionchange', () => { changes++; });
document.addEventListener('mouseup', () => setTimeout(() => {
  const sel = getSelection(), r = sel.getRangeAt(0).getBoundingClientRect();
  out.textContent += 'selected ' + JSON.stringify(sel.toString()) + ' ' + sel.direction + ' rect ' + [r.left, r.top, r.width, r.height].map(Math.round) + ' changes ' + (changes > 0) + '\n';
}, 0));
</script>
