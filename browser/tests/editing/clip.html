<!doctype html>
<title>copy, cut and paste in contenteditable</title>
<style>
body { margin: 0 }
#host { position: absolute; left: 10px; top: 10px; width: 300px; height: 30px; border: 1px solid gray }
#custom { position: absolute; left: 10px; top: 50px; width: 300px; height: 30px; border: 1px solid gray }
pre { position: absolute; top: 100px; left: 10px; margin: 0 }
</style>
<div id="host" contenteditable>one two</div>
<div id="custom" contenteditable>plain</div>
<pre id="out"></pre>
<script>
const out = document.getElementById('out'), host = document.getElementById('host'), custom = document.getElementById('custom');
const log = s => { out.textContent += s + '\n'; };
for (const type of ['copy', 'cut', 'paste']) host.addEventListener(type, e => log(type + ' ' + JSON.stringify(e.clipboardData.getData('text/plain')) + ' ' + (e instanceof ClipboardEvent)));
host.addEventListener('input', e => log(e.inputType + ' ' + JSON.stringify(host.innerHTML)));
custom.addEventListener('copy', e => { e.clipboardData.setData('text/plain', 'made by the page'); e.preventDefault(); });
custom.addEventListener('input', e => log('custom ' + JSON.stringify(custom.innerHTML)));
</script>
