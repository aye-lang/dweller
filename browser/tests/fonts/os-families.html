<!DOCTYPE html>
<title>OS families</title>
<body style="margin: 0; font-size: 50px">
<p><span id="verdana" style="font-family: Verdana, Geneva, sans-serif">mmmmmmmmmm</span></p>
<p><span id="arial" style="font-family: Arial, sans-serif">mmmmmmmmmm</span></p>
<p><span id="menlo" style="font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">mmmmmmmmmm</span></p>
<p><span id="courier" style="font-family: 'Courier New', monospace">mmmmmmmmmm</span></p>
<p><span id="dejavu-mono" style="font-family: 'DejaVu Sans Mono', monospace">mmmmmmmmmm</span></p>
<p><span id="dejavu-serif" style="font-family: 'Segoe UI', 'DejaVu Serif', sans-serif">mmmmmmmmmm</span></p>
<p><span id="sans" style="font-family: sans-serif">mmmmmmmmmm</span></p>
<pre id="out" style="font-size: 10px"></pre>
<script>
const ids = ['verdana', 'arial', 'menlo', 'courier', 'dejavu-mono', 'dejavu-serif', 'sans'];
addEventListener('load', () => setTimeout(() => {
  out.textContent = ids.map(id => `${id} ${document.getElementById(id).getBoundingClientRect().width.toFixed(3)}`).join('\n');
}, 0));
</script>
