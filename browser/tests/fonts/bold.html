<!DOCTYPE html>
<!-- Bold from a face of one weight (Tiny: synthetic bold) and from a
     variable face (TinyVar: its wght axis); rows 60 px apart. -->
<meta charset="utf-8">
<style>
@font-face { font-family: Tiny; src: url(tiny.ttf) format("truetype"); }
@font-face { font-family: TinyVar; src: url(tinyvar.ttf) format("truetype"); font-weight: 100 900; }
p { font: 48px Tiny, serif; margin: 0 8px; height: 60px }
.v { font-family: TinyVar, serif }
</style>
<p>AAAA</p>
<p><b>AAAA</b></p>
<p class="v">DDDD</p>
<p class="v"><b>DDDD</b></p>
