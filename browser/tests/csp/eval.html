<!doctype html>
<title>CSP eval</title>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
const log = s => { out.textContent += s + '\n'; };
try { log('eval: ' + eval('1 + 1')); } catch (e) { log('eval: ' + e.name); }
try { log('Function: ' + new Function('return 2')()); } catch (e) { log('Function: ' + e.name); }
</script>
