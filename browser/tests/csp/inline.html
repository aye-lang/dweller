<!doctype html>
<title>CSP inline</title>
<pre id="out"></pre>
<script nonce="r">
const out = document.getElementById('out');
const log = s => { out.textContent += s + '\n'; };
log('nonce match: ran');
</script>
<script nonce="wrong">log('nonce mismatch: ran');</script>
<script>log('hash match: ran');</script>
<script>log('unsafe-inline only: ran');</script>
<script nonce="r">log('done');</script>
