<!doctype html>
<title>CSP worker</title>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
const log = s => { out.textContent += s + '\n'; };
document.addEventListener('securitypolicyviolation', e => {
  log(e.effectiveDirective + ' ' + e.blockedURI.replace(location.origin, ''));
});
const w = new Worker('same.js');
w.onerror = () => log('worker: error');
</script>
