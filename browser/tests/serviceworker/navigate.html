<!doctype html>
<title>Service worker: a navigation answered by the worker</title>
<pre id="log">registering</pre>
<script>
(async () => {
  const sw = navigator.serviceWorker;
  for (const old of await sw.getRegistrations()) await old.unregister();
  await sw.register('worker.js');
  await new Promise(r => { sw.oncontrollerchange = r; });
  location.href = 'page.html?made';
})();
</script>
