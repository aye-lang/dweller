<!DOCTYPE html>
<title>Column flex containers: wrapping at max-height, the cross axis in rtl</title>
<style>
.f { display: flex; flex-direction: column; width: 200px; margin-bottom: 4px; }
.f > div { width: 40px; height: 10px; flex: none; }
</style>
<div class="f" style="flex-wrap: wrap; max-height: 10px"><div id="wrap-first"></div><div id="wrap-second"></div><div id="wrap-third"></div></div>
<div class="f" style="direction: rtl"><div id="rtl-start"></div><div id="rtl-end" style="align-self: flex-end"></div></div>
<div class="f" style="direction: rtl; flex-wrap: wrap; height: 10px"><div id="rtl-wrap-first"></div><div id="rtl-wrap-second" style="margin-left: 5px"></div></div>
<div class="f" style="direction: rtl; flex-wrap: wrap-reverse; height: 10px"><div id="rtl-wrap-reverse-first"></div><div id="rtl-wrap-reverse-second"></div></div>
