<!DOCTYPE html>
<style>
  div { font: 20px sans-serif; width: 200px; }
  .ls { letter-spacing: 5px; }
  .ws { word-spacing: 1em; }
  .pct { letter-spacing: 10%; word-spacing: -50%; }
  .neg { letter-spacing: -2px; }
  span { letter-spacing: 0; }
  .shrink { float: left; width: auto; letter-spacing: 0.5em; }
</style>
<div>abc def</div>
<div class="ls">abc def</div>
<div class="ws">abc def ghi jkl mno</div>
<div class="pct">abc def</div>
<div class="neg">abc def</div>
<div class="ls">ab<span>cd</span>ef</div>
<div class="shrink">ab cd</div>
