<style>
.grid { display: grid; border: solid thick; margin: 5px; height: 100px; width: 50px }
.h60 { height: 60px }
</style>

<div class="grid" style="grid: minmax(10px, auto) minmax(auto, 30px) / 10px"><div></div><div></div></div>
<div class="grid" style="height: auto; grid-template-rows: 60%"><div style="height: 25px"></div></div>
<div class="grid" style="direction: rtl; position: relative; width: 100px; height: 40px; grid: 20px / 30px 50px"><div>a</div><div>b</div><div style="position: absolute; grid-column: 2; left: 0; right: 0; top: 0; bottom: 0"></div></div>
