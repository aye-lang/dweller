<!DOCTYPE html>
<title>The stretch keyword of width and height</title>
<style>
.cb { position: relative; width: 100px; height: 60px; margin-bottom: 4px; }
.t { margin: 2px 3px; border: 1px solid; }
</style>
<div class="cb"><div class="t" id="block-height" style="height: stretch; width: 20px"></div></div>
<div class="cb"><div class="t" id="float-width" style="float: left; width: stretch; height: 5px"></div></div>
<div class="cb"><div class="t" id="alias" style="display: inline-block; width: -webkit-fill-available; height: 5px"></div></div>
<div class="cb"><div class="t" id="abspos" style="position: absolute; left: 10px; top: 10px; width: stretch; height: stretch"></div></div>
<div class="cb"><div class="t" id="max-width" style="width: 500px; max-width: stretch; height: 5px"></div></div>
<div class="cb"><div class="t" id="min-height" style="min-height: stretch; width: 20px"></div></div>
<div class="cb" style="height: auto"><div class="t" id="indefinite" style="height: stretch; width: 20px"></div></div>
<div class="cb" style="display: flex; align-items: flex-start"><div class="t" id="flex-item" style="height: stretch; width: 20px"></div></div>
