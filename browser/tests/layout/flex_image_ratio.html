<!DOCTYPE html>
<title>Images with an aspect ratio as flex items</title>
<style>
.f { display: flex; width: 40px; height: 40px; margin-bottom: 4px; }
.f > img { min-width: 0; min-height: 0; }
.start { align-items: flex-start; }
.column { flex-direction: column; }
.grow > img { flex: 1; }
</style>
<div class="f"><img id="stretched" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22/%3E" alt=""></div>
<div class="f"><img id="stretched-max-height" style="max-height: 10px" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22/%3E" alt=""></div>
<div class="f start"><img id="start-min-height" style="min-height: 34px" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22/%3E" alt=""></div>
<div class="f start"><img id="start-basis" style="flex: 0 0 30px" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22/%3E" alt=""></div>
<div class="f start column grow"><img id="column-grown" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22/%3E" alt=""></div>
<div class="f" style="width: 200px; height: auto"><img id="min-width-not-in-basis" style="min-width: 100px; flex: 1 0 auto" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%221%22 height=%221%22/%3E" alt=""><div style="flex: 1 0 1px"></div></div>
<div class="f column" style="width: 150px; height: 0"><img id="no-ratio" style="min-height: auto" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22/%3E" alt=""></div>
