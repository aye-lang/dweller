<!DOCTYPE html>
<style>
body { margin: 0 }
div { width: 100px; height: 20px }
.t1 { translate: 10px 5px }
.t2 { translate: -50% 100% }
.t3 { rotate: 90deg }
.t4 { scale: 2; transform-origin: left top }
.t5 { translate: 30px; rotate: 90deg; transform: translateX(10px) }
.t6 { transform: translateX(10px); translate: 30px }
.t7 { rotate: x 60deg }
.t8 { scale: -1 1 }
.t9 { translate: none; rotate: none; scale: none }
</style>
<div class="t1">translate 10, 5</div>
<div class="t2">translate half left, down</div>
<div class="t3">quarter turn</div>
<div class="t4">scaled</div>
<div class="t5">translate, then rotate, then transform</div>
<div class="t6">translate then transform: 40</div>
<div class="t7">rotate x: half height</div>
<div class="t8">flipped</div>
<div class="t9">none</div>
