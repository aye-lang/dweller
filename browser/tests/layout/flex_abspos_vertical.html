<!DOCTYPE html>
<title>static position of absolutely positioned flex children in vertical writing modes</title>
<style>
.f { display: flex; position: relative; width: 100px; height: 100px; margin-bottom: 4px; }
.f > div { position: absolute; width: 20px; height: 10px; }
</style>
<div class="f" style="writing-mode: vertical-rl"><div id="rl-start"></div></div>
<div class="f" style="writing-mode: vertical-rl; justify-content: flex-end; align-items: flex-end"><div id="rl-end"></div></div>
<div class="f" style="writing-mode: vertical-lr; direction: rtl; flex-direction: column-reverse"><div id="lr-rtl-column-reverse"></div></div>
<div class="f" style="writing-mode: vertical-lr; justify-content: right"><div id="lr-right"></div></div>
<div class="f" style="direction: rtl; flex-direction: column"><div id="self-start-ltr" style="direction: ltr; align-self: self-start"></div></div>
<div class="f" style="flex-wrap: wrap-reverse"><div id="last-baseline" style="align-self: last baseline"></div></div>
