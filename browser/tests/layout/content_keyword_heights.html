<!DOCTYPE html>
<title>Content keywords on min-height and max-height; heights of inline-blocks in a definite block</title>
<style>
.cb { width: 200px; height: 100px; margin-bottom: 4px; }
.box { width: 50px; }
.inner { height: 30px; }
.ib { display: inline-block; width: 20px; vertical-align: top; }
</style>
<div class="box" id="min-content-over-height" style="height: 10px; min-height: min-content"><div class="inner"></div></div>
<div class="box" id="max-content-under-height" style="height: 500px; max-height: max-content"><div class="inner"></div></div>
<div class="box" id="fit-content-min" style="height: 0; min-height: fit-content"><div class="inner"></div></div>
<div class="cb"><div class="ib" id="percent-inline-block" style="height: 50%"></div><div class="ib" id="stretch-inline-block" style="height: stretch; margin: 5px 0"></div></div>
<div class="cb" style="height: auto"><div class="ib" id="percent-in-auto" style="height: 50%"></div></div>
