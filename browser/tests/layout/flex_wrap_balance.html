<title>flex-wrap: balance</title>
<style>
.f { display: flex; width: 100px; margin-bottom: 4px; }
.f > div { width: 30px; height: 10px; flex: none; }
</style>

<div class="f" style="flex-wrap: balance"><div></div><div></div><div id="balanced-third"></div><div></div></div>
