<!DOCTYPE html>
<style>
  div { font: 20px sans-serif; width: 100px; }
  .nowrap { text-wrap: nowrap; }
  .balance { text-wrap: balance; }
  .pretty { text-wrap: pretty; }
  .stable { text-wrap-style: stable; }
  .ws-nowrap { white-space: nowrap; }
  .ws-nowrap-wrap { white-space: nowrap; text-wrap: wrap; }
  .pre-wrap { white-space: pre; text-wrap-mode: wrap; }
  .wrap-nowrap { text-wrap: wrap; white-space: nowrap; }
  .inherit span { text-wrap: wrap; }
</style>
<div>aaa bbb ccc ddd</div>
<div class="nowrap">aaa bbb ccc ddd</div>
<div class="balance">aaa bbb ccc ddd</div>
<div class="pretty">aaa bbb ccc ddd</div>
<div class="stable">aaa bbb ccc ddd</div>
<div class="ws-nowrap">aaa bbb ccc ddd</div>
<div class="ws-nowrap-wrap">aaa bbb ccc ddd</div>
<div class="pre-wrap">aaa bbb ccc ddd</div>
<div class="wrap-nowrap">aaa bbb ccc ddd</div>
<div class="nowrap inherit">aaa <span>bbb ccc ddd</span></div>
