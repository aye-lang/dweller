<!DOCTYPE html>
<title>stretched flex items: text only, and with a percentage-height child</title>
<style>
body { margin: 0; font-size: 10px }
.row { display: flex; width: 300px }
.a { flex: 1 }
.b { flex: 2 }
.tall { height: 40px }
.c { flex: 1 }
.c > div { height: 50%; width: 10px }
.col { display: flex; flex-direction: column; height: 60px; width: 100px }
.grow { flex: 1 }
</style>
<div class="row"><div class="a">one two three</div><div class="b">four</div><div class="tall">t</div></div>
<div class="row"><div class="c"><div></div></div><span class="a">text</span><div class="tall">t</div></div>
<div class="col"><div>head</div><div class="grow">body text</div></div>
