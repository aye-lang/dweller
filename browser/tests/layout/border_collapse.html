<!DOCTYPE html>
<style>
body { margin: 0 }
td { padding: 0; width: 20px; height: 10px }
#s { border-spacing: 4px 6px; border: 2px solid }
#c { border-collapse: collapse; border: 6px solid }
#c td { border: 2px solid }
#c .wide { border-right: 10px double }
#c .gone { border-top: hidden }
</style>
<table id="s"><tr><td></td><td></td></tr><tr><td colspan="2"></td></tr></table>
<table cellspacing="0"><tr><td></td></tr></table>
<table id="c"><tr><td class="wide"></td><td></td></tr><tr><td class="gone"></td><td></td></tr></table>
