<!DOCTYPE html>
<style>
body { margin: 16px }
div { width: 70px; height: 20px; margin: 0 24px 20px 0; display: inline-block; background: #eee }
.solid { outline: 3px solid black }
.dashed { outline: 2px dashed blue }
.double { outline: 6px double purple }
.offset { outline: 2px solid red; outline-offset: 4px }
.inset { outline: 4px solid green; outline-offset: inset; border: 2px solid gray }
.negative { outline: 3px solid orange; outline-offset: -8px }
.round { outline: 3px solid teal; outline-offset: 2px; border-radius: 10px }
.auto { outline: auto; border: 1px solid gray }
.current { color: maroon; outline: 4px solid currentcolor }
a { outline: 2px solid magenta }
.edge { position: absolute; left: 340px; top: 270px; width: 40px; height: 10px; outline: 40px solid navy }
</style>
<div class="solid"></div><div class="dashed"></div><div class="double"></div>
<div class="offset"></div><div class="inset"></div><div class="negative"></div>
<div class="round"></div><div class="auto"></div><div class="current"></div>
<p>Text with <a href="#">a link</a> in it.</p>
<div class="edge"></div>
