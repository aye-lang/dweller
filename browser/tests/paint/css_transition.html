<!DOCTYPE html>
<style>
body { margin: 0; background: white; }
.box { position: absolute; top: 20px; left: 20px; width: 100px; height: 60px; background-color: rgb(0, 0, 255); transition: background-color 2s linear -1s, transform 2s linear -1s; }
.box.on { background-color: rgb(255, 0, 0); transform: translateX(200px); }
.still { position: absolute; top: 120px; left: 20px; width: 100px; height: 40px; background: black; transition: background-color 2s; }
</style>
<div class="box"></div>
<div class="still"></div>
<script>
const box = document.querySelector('.box');
box.offsetWidth;
box.classList.add('on');
</script>
