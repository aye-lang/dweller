<!DOCTYPE html>
<style>
  body { margin: 0; background: white; }
  div { font: bold 32px sans-serif; height: 60px; padding: 10px; color: #246; }
  .hard { text-shadow: 4px 4px red; }
  .blur { text-shadow: 0 0 6px blue; }
  .list { text-shadow: 2px 2px 0 orange, -2px -2px 0 green, 0 6px 4px rgba(0, 0, 0, 0.5); }
  .none { text-shadow: 4px 4px red; }
  .none span { text-shadow: none; }
</style>
<div class="hard">Shadow</div>
<div class="blur">Blurred</div>
<div class="list">Stacked</div>
<div class="none">Inherit <span>none</span></div>
