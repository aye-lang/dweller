<!DOCTYPE html>
<style>
body { font: 16px sans-serif; margin: 6px }
p { margin: 0 0 10px }
.c { text-decoration: underline red }
.s { text-decoration: underline double blue }
.d { text-decoration: underline dotted green 3px }
.h { text-decoration: overline dashed 2px }
.w { text-decoration: underline wavy purple }
.t { text-decoration: line-through 4px rgb(0, 128, 255) }
.o { text-decoration: underline; text-underline-offset: 8px; text-decoration-thickness: 3px }
.n { text-decoration: underline orange }
.n span { color: gray; vertical-align: -6px }
</style>
<p class="c">underline in red</p>
<p class="s">double underline in blue</p>
<p class="d">dotted green, 3px thick</p>
<p class="h">dashed overline, 2px thick</p>
<p class="w">wavy purple underline</p>
<p class="t">line-through, 4px thick</p>
<p class="o">underline offset by 8px</p>
<p class="n">orange <span>under shifted</span> text</p>
