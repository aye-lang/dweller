<!DOCTYPE html>
<style>
body { margin: 0; background: white; }
@keyframes slide { from { transform: translateX(0); opacity: 1; } to { transform: translateX(200px); opacity: 0; } }
@keyframes grow { from { width: 20px; background: rgb(0, 0, 255); } to { width: 220px; background: rgb(255, 0, 0); } }
.box { position: absolute; top: 20px; left: 20px; width: 100px; height: 60px; background: green; animation: slide 2s linear -1s paused; }
.bar { position: absolute; top: 120px; left: 20px; height: 40px; animation: grow 4s linear -3s paused both; }
.still { position: absolute; top: 200px; left: 20px; width: 100px; height: 40px; background: black; }
</style>
<div class="box"></div>
<div class="bar"></div>
<div class="still"></div>
