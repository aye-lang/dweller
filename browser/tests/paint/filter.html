<!DOCTYPE html>
<style>
body { margin: 4px; font-size: 12px }
div { height: 17px }
.sw { display: inline-block; width: 30px; height: 12px; background-color: rgb(200, 100, 50); margin-right: 6px }
.half { opacity: 0.5 }
</style>
<div style="filter: invert(50%)"><span class="sw"></span>invert(50%)</div>
<div style="filter: grayscale(100%)"><span class="sw"></span>grayscale(100%)</div>
<div style="filter: sepia(1)"><span class="sw"></span>sepia(1)</div>
<div style="filter: saturate(2)"><span class="sw"></span>saturate(2)</div>
<div style="filter: hue-rotate(90deg)"><span class="sw"></span>hue-rotate(90deg)</div>
<div style="filter: brightness(1.5)"><span class="sw"></span>brightness(1.5)</div>
<div style="filter: contrast(50%)"><span class="sw"></span>contrast(50%)</div>
<div style="filter: opacity(0.5)"><span class="sw"></span>opacity(0.5)</div>
<div style="filter: blur(2px)"><span class="sw"></span>blur(2px)</div>
<div style="filter: drop-shadow(3px 3px 0 red)"><span class="sw"></span>drop-shadow(3px 3px 0 red)</div>
<div style="filter: invert(1) hue-rotate(180deg)"><span class="sw"></span>invert(1) hue-rotate(180deg)</div>
<div class="half"><span class="sw" style="filter: invert(1)"></span>invert(1) inside opacity 0.5</div>
<div>An inline <span style="filter: invert(50%)">span at invert(50%)</span>; url() ignored: <span style="filter: url(#none)">text</span></div>
<div style="filter: alpha(opacity=50)"><span class="sw"></span>invalid: not filtered</div>
