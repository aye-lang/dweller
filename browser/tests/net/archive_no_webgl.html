<!doctype html>
<title>Archive without WebGL</title>
<pre id="out">not run</pre>
<script>
const key = location.search.slice(1);
const gl = document.createElement('canvas').getContext('webgl');
const seen = gl ? 'on-' + gl.getParameter(gl.MAX_TEXTURE_SIZE) + '-' + gl.getSupportedExtensions().length : 'off';
fetch('/acao/webgl-' + seen + '.txt?' + key).then(() => {
  document.getElementById('out').textContent = 'webgl ' + seen;
});
</script>
