<!doctype html>
<title>Referrer links</title>
<body style="margin: 0">
<a id="unsafe" referrerpolicy="unsafe-url" style="position: absolute; left: 10px; top: 10px; width: 150px; height: 30px; display: block; background: #ccc">unsafe</a>
<a id="noref" rel="noreferrer" style="position: absolute; left: 10px; top: 60px; width: 150px; height: 30px; display: block; background: #ccc">noref</a>
<form id="nopost" method="post" rel="noreferrer">
<input name="x" value="1" type="hidden">
<button style="position: absolute; left: 10px; top: 110px; width: 100px; height: 30px">nopost</button>
</form>
<form id="see" method="post">
<input name="x" value="1" type="hidden">
<button style="position: absolute; left: 10px; top: 160px; width: 100px; height: 30px">see</button>
</form>
<script>
const to = decodeURIComponent(location.search.slice(1))
unsafe.href = to + 'unsafe.html'
noref.href = to + 'noref.html'
nopost.action = to + 'nopost.html'
see.action = to.replace('/meta/', '/see/') + 'see.html'
</script>
