<!doctype html>
<style>:root { color-scheme: light dark }</style>
<p id="log"></p>
<script>
const q = matchMedia('(prefers-color-scheme: dark)');
const log = document.getElementById('log');
log.textContent = 'start ' + q.matches + ';';
q.addEventListener('change', e => { log.textContent += ' change ' + e.matches + ' ' + e.media + ' ' + (e instanceof MediaQueryListEvent) + ';'; });
q.onchange = e => { log.textContent += ' onchange ' + e.matches + ';'; };
</script>
