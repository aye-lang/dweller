<!doctype html>
<title>prefers-color-scheme in a frame</title>
<style>
body { margin: 0 }
iframe { display: block; border: none; width: 200px; height: 40px }
</style>
<iframe id="dark" style="color-scheme: dark" src="frame_inner.html"></iframe>
<iframe id="light" style="color-scheme: light" src="frame_inner.html"></iframe>
<iframe id="normal" src="frame_inner.html"></iframe>
<pre id="out"></pre>
<script>
onload = () => {
  const out = document.getElementById('out');
  for (const id of ['dark', 'light', 'normal']) {
    const doc = document.getElementById(id).contentDocument;
    out.textContent += id + ': ' + doc.getElementById('report').textContent + '\n';
  }
};
</script>
