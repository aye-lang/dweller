<!doctype html>
<title>matchMedia change in a frame</title>
<style>iframe { border: none; width: 200px; height: 40px }</style>
<iframe id="f" src="frame_change_inner.html"></iframe>
<pre id="out"></pre>
<script>
onload = () => {
  const f = document.getElementById('f');
  f.style.colorScheme = 'dark';
  setTimeout(() => {
    document.getElementById('out').textContent = 'frame: ' + f.contentDocument.getElementById('log').textContent;
    document.title = 'done';
  }, 200);
};
</script>
