<!doctype html>
<title>Preflight nosniff</title>
<pre id="out">not run</pre>
<script>
const url = location.origin.replace('127.0.0.1', 'localhost') + '/preflight/nosniff';
fetch(url, { method: 'PUT', headers: { 'x-test': '1' } }).then(
  r => r.text().then(t => 'put: ' + r.status + ' ' + t),
  e => 'put: ' + e.name
).then(s => { document.getElementById('out').textContent = s; });
</script>
