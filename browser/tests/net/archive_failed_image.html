<!doctype html>
<title>Archive records a failed image</title>
<pre id="out">not run</pre>
<script>
const key = location.search.slice(1);
const img = new Image();
img.onload = () => { document.getElementById('out').textContent = 'image loaded'; };
img.onerror = () => {
  fetch('/acao/after-error.txt?' + key).then(() => {
    document.getElementById('out').textContent = 'image failed';
  });
};
// Port 1 refuses the connection.
img.src = 'http://127.0.0.1:1/missing.png?' + key;
</script>
