<!doctype html>
<title>Overlap</title>
<a id="named" href="download_file.txt?overlap" download="named.txt">named</a>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
const steps = [
  () => document.getElementById('named').click(),
  () => { location.href = '/attach?name=one.txt'; },
  () => { location.href = '/attach?name=two.txt'; },
  () => { location.href = '/attach?name=big.bin&times=100000'; },
];
let at = 0;
(function next() {
  steps[at++]();
  if (at < steps.length) {
    setTimeout(next, 2);
  } else {
    setTimeout(() => { out.textContent = 'still here: ' + location.pathname + ' history ' + history.length; }, 500);
  }
})();
</script>
