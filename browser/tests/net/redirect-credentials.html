<!doctype html>
<title>Redirect credentials</title>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
const log = s => { out.textContent += s + '\n'; };
const other = location.origin.replace('127.0.0.1', 'localhost');
const hop = to => '/fetch-redirect-to?' + to + '/fetch-echo';
const sent = async (name, to) => {
  const r = await fetch(hop(to), { headers: { Authorization: 'Bearer x' } });
  log(name + ': authorization ' + ('authorization' in (await r.json()).headers));
};
(async () => {
  await sent('fetch same-origin', location.origin);
  await sent('fetch cross-origin', other);
  const x = new XMLHttpRequest();
  x.open('GET', hop(other), false);
  x.setRequestHeader('Authorization', 'Bearer x');
  x.send();
  log('sync xhr cross-origin: authorization ' + ('authorization' in JSON.parse(x.responseText).headers));
})();
</script>
