<!doctype html>
<title>Data navigation</title>
<p id="out">stayed</p>
<iframe src="data:text/html,<script>parent.postMessage('frame data loaded', '*')</script>"></iframe>
<script>
const out = document.getElementById('out');
addEventListener('message', e => {
  out.textContent += ', ' + e.data;
  location = 'data:text/html,<p>top data</p>';
});
</script>
