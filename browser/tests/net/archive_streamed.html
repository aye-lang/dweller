<!doctype html>
<title>Archive streamed</title>
<pre id="out">not run</pre>
<script>
const key = 'archive-' + location.search.slice(1);
const x = new XMLHttpRequest();
let asked = false;
x.open('GET', '/parts/net/parts.html?' + key);
x.onprogress = () => {
  if (!asked) fetch('/parts-go?' + key);
  asked = true;
};
x.onload = () => {
  const t = x.responseText;
  document.getElementById('out').textContent = 'first part ' + t.startsWith('<!doctype html>') + ', rest ' + t.includes('Parts whole');
};
x.send();
</script>
