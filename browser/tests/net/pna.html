<!doctype html>
<title>Private network access</title>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
const log = s => { out.textContent += s + '\n'; };
const target = location.search.slice(1) + '/fetch-echo';
(async () => {
  await fetch(target).then(r => log('fetch: ' + r.status), e => log('fetch: ' + e.name));
  const x = new XMLHttpRequest();
  x.open('GET', target, false);
  try {
    x.send();
    log('sync xhr: ' + x.status);
  } catch (e) {
    log('sync xhr: ' + e.name);
  }
})();
</script>
