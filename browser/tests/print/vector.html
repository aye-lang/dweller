<!doctype html>
<title>Vector text</title>
<style>
@font-face { font-family: T; src: url(../fuzz/font/wpt_noto-sans-v8-latin-regular.woff) }
body { margin: 0; font: 20px T }
p { margin: 0; height: 40px }
#over { position: relative }
#cover { position: absolute; left: 0; top: 0; width: 30px; height: 10px; background: rgb(0, 128, 0) }
#faint { color: rgba(0, 0, 0, 0.5) }
#clip { width: 50px; overflow: hidden; white-space: nowrap; color: rgb(255, 0, 0) }
</style>
<p id="plain">A&eacute;A plain</p>
<p id="over">Covered<span id="cover"></span></p>
<p id="faint">Faint</p>
<p id="clip">Clipped text here</p>
<p style="opacity: 0.5">Layered</p>
