<!DOCTYPE html>
<title>Links</title>
<!-- target=_blank (no opener), rel=opener, and a named target that
     window.open reuses (tests/browser.rs window_login_popup). -->
<style>a, button { position: absolute; left: 0; width: 300px; height: 40px; display: block }</style>
<a id="blank" href="target.html?blank" target="_blank" style="top:0">blank</a>
<a id="opener" href="target.html?opener" target="_blank" rel="opener" style="top:50px">with opener</a>
<button id="named" style="top:100px">named</button>
<a id="link-named" href="target.html?link" target="w1" style="top:150px">named link</a>
<script>
let n = 0;
document.getElementById('named').addEventListener('click', function () {
  n += 1;
  const w = window.open('target.html?open' + n, 'w1');
  document.title = 'opened ' + n + ' ' + (w !== null);
});
</script>
