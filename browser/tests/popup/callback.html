<!DOCTYPE html>
<title>Callback</title>
<!-- Back on the opener's origin: the code goes to the opener, then the
     popup closes. The first message names origin B, so the opener must
     not get it. -->
<p>Done</p>
<script>
const q = new URLSearchParams(location.search);
opener.postMessage({ wrong: true }, 'http://localhost:' + location.port);
opener.postMessage({ code: q.get('code'), state: q.get('state'), seen: q.get('seen'), wrong: false }, location.origin);
window.close();
</script>
