<!DOCTYPE html>
<title>WebAssembly JS API</title>
<pre id="out"></pre>
<script>
// P11.17: the WebAssembly JS API over api.wasm (api.wat).
const lines = [];
function log(...a) {
  lines.push(a.join(' '));
  document.getElementById('out').textContent = lines.join('\n');
}
function err(f) {
  try {
    f();
    return 'no error';
  } catch (e) {
    return e.constructor.name + (e instanceof WebAssembly.RuntimeError ? ' (RuntimeError)' : '');
  }
}
async function main() {
  if (typeof WebAssembly === 'undefined') {
    log('no WebAssembly');
    return;
  }
  log('toStringTag', Object.prototype.toString.call(WebAssembly));
  const bytes = await (await fetch('api.wasm')).arrayBuffer();
  log('validate', WebAssembly.validate(bytes), WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 2, 0, 0, 0])));
  log('compile error', err(() => new WebAssembly.Module(new Uint8Array([1, 2, 3, 4]))));
  const module = new WebAssembly.Module(bytes);
  log('imports', JSON.stringify(WebAssembly.Module.imports(module)));
  log('exports', WebAssembly.Module.exports(module).map((e) => e.name + ':' + e.kind).join(' '));
  log('missing imports', err(() => new WebAssembly.Instance(module)));
  log('bad import', err(() => new WebAssembly.Instance(module, { env: { twice: 1, base: 1, big: () => 0n } })));
  let calls = 0;
  const imports = {
    env: {
      twice: (x) => { calls++; return x * 2; },
      base: 100,
      big: (x) => x * 3n,
    },
  };
  const { instance } = await WebAssembly.instantiate(bytes, imports);
  const e = instance.exports;
  log('frozen', Object.isFrozen(e), String(Object.getPrototypeOf(e)));
  log('add', e.add(2, 3), e.mul(6, 7), e.add.length, typeof e.add);
  log('i32 wrap', e.add(0x7fffffff, 1), e.add('5', 2.9));
  log('call import', e.callTwice(21), 'calls', calls);
  log('i64', e.add64(1n, 2n), e.add64(-1n, 0n), e.add64(2n ** 63n - 1n, 1n));
  log('i64 import', e.viaBig(5n));
  log('i64 number', err(() => e.add64(1, 2)));
  log('f32', e.f32(0.1), e.f32(1.5));
  const obj = { tag: 'x' };
  log('externref', e.ident(obj) === obj, String(e.ident(null)), String(e.ident(undefined)), e.ident('s'));
  log('multi', JSON.stringify(e.pair().map(String)));
  log('trap', err(() => e.boom()));
  log('div by zero', err(() => e.div(1, 0)));
  try {
    e.boom();
  } catch (x) {
    log('trap message', x.message.length > 0, x instanceof Error);
  }
  // Memory: the buffer aliases linear memory.
  const mem = e.memory;
  log('memory', mem instanceof WebAssembly.Memory, mem.buffer.byteLength, mem.buffer === mem.buffer);
  const u8 = new Uint8Array(mem.buffer);
  u8[10] = 42;
  log('wasm reads JS write', e.load(10));
  e.store(11, 77);
  log('JS reads wasm write', u8[11]);
  const old = mem.buffer;
  log('grow', mem.grow(1), 'old detached', old.byteLength, 'new', mem.buffer.byteLength, new Uint8Array(mem.buffer)[10]);
  const before = mem.buffer;
  log('wasm grow', e.grow(1), before.byteLength, mem.buffer.byteLength, before !== mem.buffer);
  log('grow past max', err(() => mem.grow(10)));
  log('transfer', err(() => mem.buffer.transfer()));
  // Tables
  const t = e.table;
  log('table', t.length, t.get(0) === e.add, t.get(1)(3, 4));
  log('call_indirect', e.dispatch(0, 5, 6), e.dispatch(1, 5, 6));
  t.set(0, e.mul);
  log('table set', e.dispatch(0, 5, 6), t.get(0) === e.mul);
  log('table grow', t.grow(1), t.length, String(t.get(2)));
  log('call null', err(() => e.dispatch(2, 1, 1)));
  log('table bad set', err(() => t.set(0, () => 1)));
  // Globals
  log('global', e.counter.value, e.bump(), e.counter.value, e.half.value);
  e.counter.value = 40;
  log('global set', e.bump());
  log('immutable', err(() => { e.half.value = 1; }));
  const g = new WebAssembly.Global({ value: 'i64', mutable: true }, 5n);
  g.value = 6n;
  log('new global', g.value, g.valueOf(), new WebAssembly.Global({ value: 'f32' }, 0.1).value);
  // A Memory and a Table made by JS
  const m2 = new WebAssembly.Memory({ initial: 1, maximum: 2 });
  log('new memory', m2.buffer.byteLength, m2.grow(1), m2.buffer.byteLength, err(() => m2.grow(1)));
  const t2 = new WebAssembly.Table({ element: 'externref', initial: 2 }, 'init');
  t2.set(1, obj);
  log('new table', t2.length, t2.get(0), t2.get(1) === obj);
  log('bad memory', err(() => new WebAssembly.Memory({ initial: 2, maximum: 1 })), err(() => new WebAssembly.Memory()));
  // A JS exception thrown through wasm comes back as itself.
  const thrower = new WebAssembly.Instance(module, {
    env: { twice: () => { throw new SyntaxError('from JS'); }, base: 0, big: (x) => x },
  });
  try {
    thrower.exports.callTwice(1);
  } catch (x) {
    log('JS exception through wasm', x.constructor.name, x.message);
  }
  // Imported wasm functions keep their identity.
  const reexp = new WebAssembly.Instance(module, { env: { twice: e.load, base: 1, big: e.viaBig } });
  log('wasm import', reexp.exports.callTwice(10), reexp.exports.viaBig(2n), reexp.exports.add !== e.add);
  log('LinkError', err(() => new WebAssembly.Instance(module, { env: { twice: e.add, base: 1, big: e.viaBig } })));
  log('global type', err(() => new WebAssembly.Instance(module, { env: { twice: e.load, base: 1n, big: e.viaBig } })));
  // instantiate(Module) gives an Instance; streaming over a Response.
  const inst2 = await WebAssembly.instantiate(module, imports);
  log('instantiate(module)', inst2 instanceof WebAssembly.Instance, inst2.exports.add(1, 1));
  const streamed = await WebAssembly.instantiateStreaming(
    new Response(bytes, { headers: { 'Content-Type': 'application/wasm' } }), imports);
  log('instantiateStreaming', streamed.module instanceof WebAssembly.Module, streamed.instance.exports.mul(3, 3));
  try {
    await WebAssembly.compileStreaming(new Response(bytes, { headers: { 'Content-Type': 'text/plain' } }));
  } catch (x) {
    log('wrong MIME', x.constructor.name);
  }
  try {
    await WebAssembly.compile(new Uint8Array([0, 97, 115, 109]));
  } catch (x) {
    log('compile rejects', x instanceof WebAssembly.CompileError, x.name);
  }
}
main().catch((x) => log('FAILED', x && x.stack || x));
</script>
