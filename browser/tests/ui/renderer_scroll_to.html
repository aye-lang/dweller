<!DOCTYPE html>
<title>Scroll</title>
<body style="margin: 0; height: 3000px; background: linear-gradient(#36c, #c63)">
<div style="position: absolute; top: 300px; width: 100px; height: 40px; background: #3c6"></div>
<div style="position: absolute; top: 900px; width: 100px; height: 40px; background: #c36"></div>
<script>
scrollTo(0, 300);
document.addEventListener('keydown', (e) => { if (e.key === 's') scrollTo(0, 900); });
</script>
