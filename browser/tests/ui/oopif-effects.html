<!DOCTYPE html>
<title>Parent</title>
<body style="margin: 0; background: #def">
<div id="box" style="margin: 10px 20px; width: 150px; height: 60px; background: #9c9">
<p style="margin: 0; height: 30px">above</p>
</div>
<p style="margin: 0 20px">below the frame</p>
<script>
const host = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
const framed = document.createElement('iframe');
const styles = {
  '?hidden': 'overflow: hidden',
  '?scrolled': 'overflow: auto',
  '?moved': 'transform: translate(30px, 20px); height: 140px; width: 220px',
  '?faded': 'opacity: 0.5; height: 140px; width: 220px',
};
framed.src = 'http://' + host + ':' + location.port + '/ui/oopif-child.html';
framed.style.cssText = 'display: block; width: 200px; height: 100px; border: 0';
box.style.cssText += '; ' + styles[location.search];
box.appendChild(framed);
if (location.search === '?scrolled') { box.scrollTop = 45; }
</script>
