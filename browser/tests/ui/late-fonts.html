<!DOCTYPE html>
<title>Late fonts</title>
<body style="margin: 8px; font: 20px sans-serif">
<p style="margin: 0">Latin, then 中文字 日本語 한국어</p>
<p style="margin: 0">عربي עברית ∑ ☂ ✈</p>
<p style="margin: 0; font: italic bold 20px serif">serif bold italic 中文</p>
<canvas id="c" width="300" height="60"></canvas>
<script>
const g = c.getContext('2d');
g.font = '20px sans-serif';
g.fillText('canvas 中文字 text', 4, 24);
g.font = 'bold 20px monospace';
g.fillText('mono ☂', 4, 50);
</script>
