<!DOCTYPE html>
<title>Copy</title>
<script>
const said = [];
const say = (w) => { said.push(w); document.title = 'Copy ' + said.join(','); };
document.addEventListener('copy', () => say('copy'));
addEventListener('load', () => { f.oninput = () => say('pasted ' + f.value.replace(/\s+/g, ' ').trim()); });
</script>
<body style="margin: 0">
<input id="f" style="display: block; margin: 0; width: 300px; height: 30px; box-sizing: border-box">
<p style="margin: 0">alpha beta</p>
