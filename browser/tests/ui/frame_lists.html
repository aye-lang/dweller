<!doctype html>
<style>
body { margin: 0 }
iframe { position: absolute; top: 40px; width: 180px; height: 120px; border: 0 }
#a { left: 10px }
#b { left: 200px }
</style>
<p id="label">0%</p>
<iframe id="a" srcdoc="<body style='margin:0;background:rgb(0,128,0)'><p>still</p></body>"></iframe>
<iframe id="b" srcdoc="<body style='margin:0;background:rgb(0,0,160)'><p id=n>b0</p><script>let k = 0; function tick() { k += 1; document.getElementById('n').textContent = 'b' + k; if (k < 10) requestAnimationFrame(tick) } requestAnimationFrame(tick)</script></body>"></iframe>
<script>
let ticks = 0;
function tick() {
  ticks += 1;
  document.getElementById("label").textContent = "0%";
  if (ticks < 40) {
    requestAnimationFrame(tick);
  }
}
requestAnimationFrame(tick);
</script>
