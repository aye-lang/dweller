<!DOCTYPE html>
<title>Parent</title>
<body style="margin: 0; background: #def">
<button id="grow" style="display: block; width: 120px; height: 24px; margin: 0">grow</button>
<script>
const host = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
const child = location.search === '?deny' ? '/csp/frame-deny.html' : '/ui/oopif-child.html';
const other = document.createElement('iframe');
const passed = location.search === '?nav' || location.search === '?away' ? location.search : '';
other.src = 'http://' + host + ':' + location.port + child + passed;
other.style.cssText = 'display: block; margin: 10px 20px; width: 200px; height: 100px; border: 2px solid #345';
const same = document.createElement('iframe');
same.src = '/ui/oopif-child.html?same';
same.style.cssText = 'display: block; margin: 0 20px; width: 160px; height: 60px; border: 2px solid #543';
document.body.appendChild(other);
document.body.appendChild(same);
if (location.search === '?scroll') { document.body.style.height = '2000px'; }
grow.onclick = () => {
  if (location.search === '?remove') { other.remove(); } else { other.style.width = '260px'; other.style.height = '130px'; }
};
</script>
