<!DOCTYPE html>
<title>R</title>
<body style="margin: 0">
<div id="seen" style="height: 20px">seen</div>
<script>
new IntersectionObserver((es) => {
  const e = es[es.length - 1];
  parent.postMessage((e.rootBounds === null ? 'null' : 'rect') + ' ' + e.isIntersecting, '*');
}, { rootMargin: '10px' }).observe(seen);
</script>
