<!doctype html>
<style>
body { margin: 0 }
input { position: absolute; left: 10px; top: 10px }
#box { position: absolute; left: 100px; top: 60px; width: 40px; height: 30px; background: rgb(0, 128, 0) }
</style>
<input id="field" value="ab">
<div id="box"></div>
<script>
document.getElementById("field").focus();
let ticks = 0;
function tick() {
  ticks += 1;
  if (ticks < 5) {
    requestAnimationFrame(tick);
    return;
  }
  document.getElementById("box").style.background = "rgb(200, 0, 0)";
}
requestAnimationFrame(tick);
</script>
