<!DOCTYPE html>
<body style="margin: 0">
<p id="o">none</p>
<div id="d" style="height: 3000px"></div>
<script>
// The wheel events the page gets (window.aye flushWheel): how many,
// their deltas summed, their deltaMode; and how many scroll events.
// ?cancel: the div's listener cancels them (no scrolling). The window's
// listener is passive by default: its preventDefault does nothing.
let n = 0, dx = 0, dy = 0, mode = -1, scrolls = 0;
document.getElementById('d').addEventListener('wheel', (e) => {
  n++; dx += e.deltaX; dy += e.deltaY; mode = e.deltaMode;
  if (location.search === '?cancel') e.preventDefault();
});
addEventListener('wheel', (e) => e.preventDefault());
addEventListener('scroll', () => scrolls++);
setInterval(() => {
  document.getElementById('o').textContent = `wheel=${n} dx=${dx} dy=${dy} mode=${mode} scrolls=${scrolls} y=${scrollY}`;
}, 50);
</script>
