<!DOCTYPE html>
<title>Stuck</title>
<style>body { margin: 0 } button { display: block; width: 200px; height: 50px; margin: 0 }</style>
<button id="hang">Hang</button>
<button id="after">After</button>
<p id="log">start</p>
<script>
const log = s => { document.getElementById('log').textContent += ' ' + s; };
document.getElementById('hang').addEventListener('click', () => {
  log('hang');
  try { while (1) {} } catch (e) { log('caught'); } finally { log('finally'); }
});
document.getElementById('after').addEventListener('click', () => log('after'));
</script>
