<!DOCTYPE html>
<title>P</title>
<body style="margin: 0">
<div id="own" style="height: 20px">own</div>
<script>
const host = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
const said = {};
const say = (who, what) => { said[who] = what; document.title = 'P own ' + (said.own || '-') + ' frame ' + (said.frame || '-'); };
const shape = (e) => e.rootBounds === null ? 'null' : 'rect ' + e.rootBounds.width;
new IntersectionObserver((es) => say('own', shape(es[es.length - 1])), { rootMargin: '10px' }).observe(own);
addEventListener('message', (e) => say('frame', e.data));
const framed = document.createElement('iframe');
framed.src = 'http://' + host + ':' + location.port + '/ui/oopif-root-child.html';
framed.style.cssText = 'display: block; width: 200px; height: 100px; border: 0';
document.body.appendChild(framed);
</script>
