<!DOCTYPE html>
<title>Focus</title>
<body style="margin: 0">
<input value="first field" style="position: absolute; left: 10px; top: 10px; width: 200px; height: 24px">
<input value="second field" style="position: absolute; left: 10px; top: 50px; width: 200px; height: 24px">
<input value="third field" style="position: absolute; left: 10px; top: 90px; width: 200px; height: 24px">
<button style="position: absolute; left: 10px; top: 130px; width: 100px; height: 30px" onclick="history.pushState(null, '', '?pushed'); document.title = 'Pushed'">Push</button>
