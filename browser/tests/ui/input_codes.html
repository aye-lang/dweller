<!DOCTYPE html>
<title>Input codes</title>
<style>body { margin: 0 } #pad { width: 300px; height: 100px; background: #ddd }</style>
<div id="pad">pad</div>
<pre id="log"></pre>
<script>
const log = s => { document.getElementById('log').textContent += s + '\n'; };
const mods = e => (e.shiftKey ? 'S' : '') + (e.ctrlKey ? 'C' : '') + (e.altKey ? 'A' : '') + (e.metaKey ? 'M' : '');
for (const t of ['keydown', 'keyup'])
  document.addEventListener(t, e => log(t + ' ' + e.key + ' ' + e.code + ' r' + +e.repeat + ' l' + e.location + ' ' + mods(e) + ' ' + e.isTrusted));
const pad = document.getElementById('pad');
for (const t of ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'pointerleave', 'mousedown', 'mousemove', 'mouseup', 'click'])
  pad.addEventListener(t, e => log(t + ' ' + e.clientX + ',' + e.clientY + ' b' + e.button + '/' + e.buttons +
    (e.pointerId ? ' id' + e.pointerId + (e.isPrimary ? 'P' : '') + ' ' + e.pointerType : '') + ' m' + e.movementX + ',' + e.movementY));
document.addEventListener('visibilitychange', () => log('vis ' + document.visibilityState + ' ' + document.hidden));
</script>
