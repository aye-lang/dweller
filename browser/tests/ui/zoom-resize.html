<!doctype html>
<title>zoom resize</title>
<body style="margin:0;font:16px/20px monospace">
<pre id="out" style="margin:0">start</pre>
<script>
var count = 0;
addEventListener('resize', function (e) {
  count++;
  document.getElementById('out').textContent += '\nresize ' + count + ' w' + innerWidth + ' dpr' + devicePixelRatio + ' ' + (e.target === window);
  document.title = 'resized' + count;
});
</script>
