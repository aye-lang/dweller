<!DOCTYPE html>
<title>Replace</title>
<body>
<script>
const other = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
const away = location.protocol + '//' + other + ':' + location.port + location.pathname;
const step = location.search;
const once = (next) => {
  if (sessionStorage.getItem('left' + step)) return;
  sessionStorage.setItem('left' + step, '1');
  location.href = next;
};
document.title = 'Replace ' + step + ' ' + history.length;
if (!step) { once('?second'); }
if (step === '?second') { location.replace('?third'); }
if (step === '?go') { once('?far'); }
if (step === '?far') { location.replace(away + '?landed'); }
</script>
