<!doctype html>
<title>range</title>
<body style="margin:0">
<input id="r" type="range" style="position:absolute;left:0;top:0;width:200px;height:20px;margin:0">
<button id="b" style="position:absolute;left:0;top:60px;width:100px;height:30px">b</button>
<p id="out" style="position:absolute;top:120px;margin:0"></p>
<script>
const out = document.getElementById('out');
document.getElementById('r').addEventListener('input', e => { out.textContent += 'input ' + e.target.value + ';'; });
document.getElementById('b').addEventListener('click', () => { out.textContent += 'click;'; });
</script>
