<!DOCTYPE html>
<title>child</title>
<script>
let saw = 'opener null';
try {
  if (window.opener) {
    saw = 'opener ' + opener.document.title;
    opener.document.title = 'set-by' + location.search;
    saw += '>' + opener.document.title;
  }
} catch (e) {
  saw = 'opener ' + e.name;
}
document.title = saw + ' name ' + window.name + ' ' + location.search;
</script>
