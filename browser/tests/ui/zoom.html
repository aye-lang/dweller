<!doctype html>
<title>zoom</title>
<style>
body { margin: 0; font: 16px/20px monospace; }
#hit { position: absolute; left: 100px; top: 60px; width: 60px; height: 30px; background: #06c; }
#out { height: 40px; }
</style>
<div id="out"></div>
<div id="hit"></div>
<a href="zoom-next.html" id="next">next</a>
<script>
var clicks = '';
function show() {
  document.getElementById('out').textContent = 'w' + innerWidth + ' dpr' + devicePixelRatio + ' wide' + matchMedia('(min-width: 300px)').matches + ' ' + clicks;
}
document.getElementById("hit").onpointerdown = function (e) { clicks = "down" + e.clientX + "," + e.clientY; show(); };
document.getElementById("hit").onclick = function () { clicks += " hit"; show(); };
addEventListener('resize', show);
show();
</script>
