<!DOCTYPE html>
<title>Sandboxed</title>
<body>
<form method="post" action="oopif-sandbox-child.html?posted"><button>go</button></form>
<script>
const tried = (read) => { try { read(); return 'ok'; } catch (e) { return e.name; } };
const cookie = tried(() => document.cookie);
const storage = tried(() => localStorage.getItem('k'));
document.title = 'Sandboxed cookie ' + cookie + ' storage ' + storage + location.search;
if (!location.search) { document.forms[0].submit(); }
</script>
