<!doctype html>
<title>Frees</title>
<p id="out">allocating</p>
<script>
let kept = [];
for (let i = 0; i < 40000; i++) kept.push('y'.repeat(1000) + i);
kept = null;
let again = [];
for (let i = 0; i < 40000; i++) again.push('z'.repeat(1000) + i);
document.getElementById('out').textContent = 'freed ' + again.length;
</script>
