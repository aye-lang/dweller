<!DOCTYPE html>
<title>Opener</title>
<body style="margin: 0">
<button id="same" style="display: block; width: 300px; height: 40px; margin: 0">same site</button>
<button id="none" style="display: block; width: 300px; height: 40px; margin: 0">noopener</button>
<button id="cross" style="display: block; width: 300px; height: 40px; margin: 0">other site</button>
<button id="alive" style="display: block; width: 300px; height: 40px; margin: 0">alive</button>
<button id="leave" style="display: block; width: 300px; height: 40px; margin: 0">leave</button>
<button id="probe" style="display: block; width: 300px; height: 40px; margin: 0">closed?</button>
<script>
const host = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
let w = null;
same.onclick = () => { w = window.open('popup_child.html?same', 'w1'); };
probe.onclick = () => { document.title = 'closed-' + (w && w.closed); };
none.onclick = () => { window.open('popup_child.html?none', '_blank', 'noopener'); };
cross.onclick = () => { window.open('http://' + host + ':' + location.port + '/ui/popup_child.html?cross', 'w2'); };
alive.onclick = () => { document.title = 'opener-alive'; };
leave.onclick = () => { location.href = 'http://' + host + ':' + location.port + '/ui/popup_child.html?away'; };
</script>
