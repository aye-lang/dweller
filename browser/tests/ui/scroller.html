<!DOCTYPE html>
<body style="margin: 0">
<p id="o" style="margin: 0; height: 20px">none</p>
<div id="s" style="height: 100px; width: 200px; overflow: auto">
<div style="height: 300px; width: 600px"></div>
</div>
<div style="height: 3000px"></div>
<script>
// The scroller's offsets and the page's (window.aye flushWheel, key):
// ?contain: the scroller stops scroll chaining.
const s = document.getElementById('s');
if (location.search === '?contain') s.setAttribute('style', s.getAttribute('style') + '; overscroll-behavior: contain');
let scrolls = 0, ends = 0;
s.addEventListener('scroll', () => scrolls++);
s.addEventListener('scrollend', () => ends++);
setInterval(() => {
  document.getElementById('o').textContent = `top=${s.scrollTop} left=${s.scrollLeft} y=${scrollY} scrolled=${scrolls > 0} ends=${ends}`;
}, 20);
</script>
