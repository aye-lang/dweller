<!DOCTYPE html>
<title>P</title>
<body style="margin: 0; background: #def; height: 2000px">
<input id="a" style="display: block; margin: 0; width: 120px; height: 24px; box-sizing: border-box">
<div id="gap" style="height: 0"></div>
<iframe id="f" style="display: block; margin: 10px 20px; width: 200px; height: 100px; border: 2px solid #345"></iframe>
<input id="b" style="display: block; margin: 0; width: 120px; height: 24px; box-sizing: border-box">
<script>
const host = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
const said = [];
const log = (w) => { said.push(w); document.title = 'P ' + said.join(','); };
if (location.search === '?io') gap.style.height = '500px';
f.src = 'http://' + host + ':' + location.port + '/ui/oopif-input-child.html' + location.search;
a.onfocus = () => log('a');
b.onfocus = () => log('b');
document.addEventListener('keydown', (e) => {
  log('key ' + e.key);
  if (e.key === 'f') f.focus();
});
document.addEventListener('pointerup', (e) => log('up'));
</script>
