<!doctype html>
<title>attribute changes that no selector names</title>
<style>
[data-y] { padding-left: 20px }
</style>
<div id="x">a div whose data-x and aria-label no selector names</div>
<p>end</p>
<script>
// Each frame changes attributes that no selector names: no layout
// (window_relayout_attr).
let n = 0;
function tick() {
  n++;
  const x = document.getElementById('x');
  x.dataset.x = n;
  x.setAttribute('aria-label', 'frame ' + n);
  if (n < 40) {
    requestAnimationFrame(tick);
  }
}
requestAnimationFrame(tick);
</script>
