<!DOCTYPE html>
<title>Sites</title>
<body style="margin: 0">
<button id="other" style="display: block; width: 300px; height: 40px; margin: 0">other site</button>
<button id="same" style="display: block; width: 300px; height: 40px; margin: 0">same site</button>
<script>
const host = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
document.title = location.hostname + location.search;
other.onclick = () => { location.href = 'http://' + host + ':' + location.port + location.pathname; };
same.onclick = () => { location.href = location.pathname + '?same'; };
</script>
