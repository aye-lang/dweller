<!doctype html>
<title>dialogs</title>
<style>
body { margin: 0 }
button { position: absolute; left: 10px; width: 80px; height: 24px }
#alert { top: 10px }
#confirm { top: 40px }
#prompt { top: 70px }
pre { position: absolute; top: 100px; left: 10px; margin: 0 }
</style>
<button id="alert">alert</button>
<button id="confirm">confirm</button>
<button id="prompt">prompt</button>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
const log = s => { out.textContent += s + '\n'; };
document.getElementById('alert').onclick = () => log('alert ' + alert('hello\nthere'));
document.getElementById('confirm').onclick = () => log('confirm ' + confirm('sure?'));
document.getElementById('prompt').onclick = () => log('prompt ' + JSON.stringify(prompt('name?', 'you')));
</script>
