<!doctype html>
<title>Long task</title>
<input id="f">
<p id="p">before</p>
<script>
const f = document.getElementById('f');
const p = document.getElementById('p');
f.focus();
f.addEventListener('input', () => {
  p.textContent += ', typed ' + f.value;
});
const end = Date.now() + 4000;
while (Date.now() < end) {}
p.textContent = 'ran 4 s';
</script>
