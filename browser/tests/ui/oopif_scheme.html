<!doctype html>
<title>Schemes</title>
<style>
body { margin: 0; background: rgb(0, 128, 0) }
iframe { border: 0; width: 50px; height: 50px; position: absolute; top: 0 }
</style>
<script>
const host = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
const there = 'http://' + host + ':' + location.port + '/color-scheme/';
const frames = [['frame_canvas_plain.html', ''], ['frame_canvas_dark.html', ''], ['frame_canvas_tinted.html', ''], ['frame_canvas_plain.html', 'color-scheme: dark'], ['frame_canvas_prefers.html', 'color-scheme: dark']];
frames.forEach(([page, style], k) => {
  const f = document.createElement('iframe');
  f.src = there + page;
  f.style.cssText = 'left: ' + k * 60 + 'px; ' + style;
  document.body.appendChild(f);
});
</script>
