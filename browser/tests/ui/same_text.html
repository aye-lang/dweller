<!doctype html>
<style>
body { margin: 0 }
</style>
<p id="label">0%</p>
<script>
let ticks = 0;
function tick() {
  ticks += 1;
  document.getElementById("label").textContent = ticks == 30 ? "1%" : "0%";
  if (ticks < 60) {
    requestAnimationFrame(tick);
  }
}
requestAnimationFrame(tick);
</script>
