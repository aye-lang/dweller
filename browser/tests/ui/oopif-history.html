<!DOCTYPE html>
<title>P</title>
<body style="margin: 0">
<script>
const host = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
const loads = Number(sessionStorage.getItem('loads') || 0) + 1;
sessionStorage.setItem('loads', String(loads));
document.title = 'P loads ' + loads;
const framed = document.createElement('iframe');
framed.src = 'http://' + host + ':' + location.port + '/ui/oopif-history-child.html';
framed.style.cssText = 'display: block; width: 200px; height: 100px; border: 0';
document.body.appendChild(framed);
</script>
