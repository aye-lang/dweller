<!DOCTYPE html>
<title>Evil</title>
<body style="margin: 0">
<button id="other" style="display: block; width: 300px; height: 40px; margin: 0">other site</button>
<script>
const host = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
const frame = document.createElement('iframe');
frame.src = 'http://' + host + ':' + location.port + '/ui/site-lock-frame.html' + location.search;
document.body.appendChild(frame);
history.pushState(null, '', location.search + '&pushed');
other.onclick = () => { location.href = 'http://' + host + ':' + location.port + location.pathname; };
</script>
