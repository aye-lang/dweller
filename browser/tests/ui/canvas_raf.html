<!doctype html>
<style>
body { margin: 0 }
canvas { position: absolute; left: 10px; top: 10px }
iframe { position: absolute; left: 10px; top: 150px; width: 300px; height: 120px; border: 0 }
</style>
<canvas id="c" width="300" height="100"></canvas>
<iframe srcdoc="<body style='margin:0'><canvas id=d width=300 height=120></canvas><script>let k = 0; const g = document.getElementById('d').getContext('2d'); function tick() { k += 1; g.fillStyle = 'rgb(' + k * 5 + ',40,160)'; g.fillRect(k * 6, 20, 20, 20); if (k < 40) requestAnimationFrame(tick) } requestAnimationFrame(tick)</script></body>"></iframe>
<script>
const g = document.getElementById("c").getContext("2d");
let k = 0;
function tick() {
  k += 1;
  g.fillStyle = "rgb(200," + k * 5 + ",40)";
  g.fillRect(k * 6, 30, 20, 20);
  if (k < 40) {
    requestAnimationFrame(tick);
  }
}
requestAnimationFrame(tick);
</script>
