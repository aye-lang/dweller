<!DOCTYPE html>
<title>C</title>
<body style="margin: 0; background: #fed">
<input id="c" style="display: block; margin: 0; width: 100px; height: 20px; box-sizing: border-box">
<div style="height: 300px; background: linear-gradient(#fed, #c33)"></div>
<script>
const said = [];
const log = (w) => { said.push(w); document.title = 'C ' + said.join(','); };
c.onfocus = () => log('focus');
c.onblur = () => log('blur');
c.oninput = () => log('value ' + c.value);
document.addEventListener('pointerdown', (e) => log('down ' + e.clientX + ',' + e.clientY));
document.addEventListener('click', () => log('click'));
document.addEventListener('keydown', (e) => { if (e.key !== 'Tab') log('key ' + e.key); });
document.addEventListener('pointerup', (e) => log('up ' + e.clientX + ',' + e.clientY));
addEventListener('scroll', () => log('scroll ' + scrollY));
if (location.search === '?io') new IntersectionObserver((es) => log('io ' + es[es.length - 1].isIntersecting)).observe(c);
</script>
