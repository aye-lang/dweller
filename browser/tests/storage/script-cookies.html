<!doctype html>
<title>Script cookies</title>
<!-- tests/browser.rs window_renderer_storage: a script sets cookies;
     HttpOnly and Secure ones (on http:) are not stored. -->
<p id="out">no script</p>
<script>
document.cookie = "js=1; Path=/";
document.cookie = "ho=1; Path=/; HttpOnly";
document.cookie = "sec=1; Path=/; Secure";
document.getElementById("out").textContent = "script cookies: [" + document.cookie + "]";
</script>
