<!doctype html>
<title>Listen</title>
<!-- tests/browser.rs window_renderer_storage: the other tabs write
     localStorage; this tab shows the storage events it heard. -->
<p id="out">heard nothing</p>
<script>
const seen = [];
window.addEventListener("storage", function (e) {
  seen.push(e.key + "=" + e.newValue + " (old " + e.oldValue + ", from " + e.url.split("/").pop() + ")");
  document.getElementById("out").textContent = "heard " + seen.join(" | ");
});
</script>
