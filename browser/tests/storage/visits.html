<!doctype html>
<title>Visits</title>
<!-- tests/browser.rs window_renderer_storage: sessionStorage outlives a
     navigation in the tab. -->
<p id="out">no script</p>
<script>
const n = Number(sessionStorage.getItem("visits") || 0) + 1;
sessionStorage.setItem("visits", String(n));
document.getElementById("out").textContent = "visits " + n;
</script>
