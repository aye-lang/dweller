<!DOCTYPE html>
<title>A media element a script made</title>
<pre id="out"></pre>
<script>
const audio = document.createElement('audio');
const source = document.createElement('source');
audio.addEventListener('loadeddata', () => { document.getElementById('out').textContent += 'loadeddata without a touch\n'; });
source.setAttribute('src', 'tone.wav');
audio.appendChild(source);
document.body.appendChild(audio);
const missing = document.createElement('video');
const gone = document.createElement('source');
gone.addEventListener('error', () => { document.getElementById('out').textContent += 'error at the source of a missing file\n'; });
gone.setAttribute('src', 'none.webm');
missing.appendChild(gone);
document.body.appendChild(missing);
</script>
