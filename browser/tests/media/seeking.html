<!doctype html>
<title>Media seeking</title>
<pre>seeking videos</pre>
<script>
for (let k = 0; k < 8; k++) {
  const v = document.createElement('video');
  let t = 0;
  v.src = 'clip.mkv';
  v.muted = true;
  v.preload = 'auto';
  v.addEventListener('loadeddata', () => setInterval(() => { t = (t + 0.21) % 0.9; v.currentTime = t; }, 1));
  document.body.appendChild(v);
}
</script>
