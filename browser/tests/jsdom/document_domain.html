<!doctype html>
<title>document.domain</title>
<p id="out">pending</p>
<script>
let refused = 'set';
try { document.domain = 'example.com'; } catch (e) { refused = e.name; }
document.getElementById('out').textContent =
  refused + ' ' + typeof document.domain + ' ' + (document.domain === location.hostname);
</script>
