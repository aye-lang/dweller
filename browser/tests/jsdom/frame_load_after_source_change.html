<!DOCTYPE html>
<title>One load event for the document the frame asks for</title>
<p id="out"></p>
<script>
const frame = document.createElement('iframe');
document.body.append(frame);
const blank = frame.contentDocument.URL;
frame.srcdoc = '<p>second</p>';
frame.onload = () => {
  document.getElementById('out').textContent += blank + ' then ' + frame.contentDocument.querySelector('p').textContent + '; ';
};
</script>
