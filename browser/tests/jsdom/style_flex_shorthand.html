<!DOCTYPE html>
<title>The inline flex and flex-flow shorthands</title>
<div id="box"></div>
<pre id="out"></pre>
<script>
function log(...parts) { document.getElementById('out').textContent += parts.map(String).join(' ') + '\n'; }
const style = document.getElementById('box').style;

function set(prop, value) {
  style.cssText = '';
  style[prop] = value;
  return '[' + style[prop] + ']';
}

for (const v of ['none', '1', '6px 4', '7% 8', 'auto 1 2', '0 0 0', 'none 1', '2 3 4', '5px 7%']) log('flex', v, set('flex', v));
for (const v of ['nowrap column', 'row wrap', 'wrap row-reverse', 'nowrap', 'column wrap column']) log('flex-flow', v, set('flex-flow', v));

style.cssText = 'flex: 2 3 4px';
log('longhands', style.flexGrow, style.flexShrink, style.flexBasis, style.length);
style.flexShrink = '';
log('after removing flex-shrink', style.cssText, style.length);

style.cssText = '';
style.setProperty('-webkit-flex-grow', '5');
log('alias', style.cssText, style.getPropertyValue('-webkit-flex-grow'));
style.flexBasis = '-1px';
style.flexGrow = '.50';
log('longhand checks', style.cssText);
</script>
