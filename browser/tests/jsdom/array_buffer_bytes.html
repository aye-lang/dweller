<!doctype html>
<title>ArrayBuffer bytes in web APIs</title>
<!-- P11.3: Blob, Response and FileReader bodies, TextEncoder/TextDecoder
     and crypto.getRandomValues read and write the ArrayBuffer's bytes. -->
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
const log = (...xs) => { out.textContent += xs.join(' ') + '\n'; };
const show = u => '[' + Array.from(u).join(',') + ']';
const bytes = new Uint8Array([0, 1, 127, 128, 200, 255]);
const blob = new Blob([bytes, 'é', new Uint16Array([0x4241]).buffer, new Blob(['z'])]);
log('blob size', blob.size);
const r = new Uint8Array(16);
log('random', crypto.getRandomValues(r) === r, r.length);
let err = '';
try { crypto.getRandomValues(new Float32Array(2)); } catch (e) { err = e.name; }
try { crypto.getRandomValues(new Uint8Array(65537)); } catch (e) { err += ' ' + e.name; }
log('random errors', err);
(async () => {
  log('blob bytes', show(new Uint8Array(await blob.arrayBuffer())));
  log('blob slice text', await blob.slice(6, 8).text());
  log('response', show(new Uint8Array(await new Response(bytes).arrayBuffer())));
  log('response text', await new Response(new TextEncoder().encode('héllo')).text());
  const fr = new FileReader();
  fr.onload = () => log('filereader', show(new Uint8Array(fr.result)));
  fr.readAsArrayBuffer(new Blob([bytes.subarray(3)]));
})();
</script>
