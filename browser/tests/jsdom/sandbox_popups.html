<!DOCTYPE html>
<title>Sandbox popups</title>
<iframe sandbox="allow-scripts allow-same-origin allow-popups" srcdoc="<script>open('sandbox/popup.html?inherits')</script>"></iframe>
<iframe sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox" srcdoc="<script>open('sandbox/popup.html?escapes')</script>"></iframe>
<iframe sandbox="allow-scripts allow-same-origin" srcdoc="<a target=_blank rel=opener href=sandbox/popup.html?link-without-allow-popups>popup</a><script>document.links[0].click()</script>"></iframe>
<iframe sandbox="allow-scripts allow-same-origin allow-popups" srcdoc="<a target=_blank rel=opener href=sandbox/popup.html?link-with-allow-popups>popup</a><script>document.links[0].click()</script>"></iframe>
<iframe id="no-scripts" sandbox="allow-same-origin allow-popups" srcdoc="no scripts"></iframe>
<iframe id="no-scripts-escapes" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" srcdoc="no scripts"></iframe>
<script>
onmessage = e => console.log(e.data);
onload = () => {
  document.getElementById('no-scripts').contentWindow.open('sandbox/popup.html?opener-without-allow-scripts');
  document.getElementById('no-scripts-escapes').contentWindow.open('sandbox/popup.html?opener-without-allow-scripts-escapes');
};
</script>
