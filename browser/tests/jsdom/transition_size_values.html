<!DOCTYPE html>
<title>Transitions of sizes: shorthands, mixed units, discrete steps</title>
<div style="width: 200px"><div id="a" style="padding: 10px"></div><div id="b"></div><div id="c" style="width: 10px"></div></div>
<pre id="out"></pre>
<script>
function log(...parts) { document.getElementById('out').textContent += parts.map(String).join(' ') + '\n'; }
const a = document.getElementById('a');
getComputedStyle(a).paddingTop;
a.style.transition = 'padding 100s linear -50s';
a.style.padding = '20px';
log('shorthand read', getComputedStyle(a).padding, getComputedStyle(a).paddingTop);

const b = document.getElementById('b');
getComputedStyle(b).minWidth;
b.style.transition = 'min-width 100s linear -30s allow-discrete';
b.style.minWidth = '40px';
log('discrete before half', getComputedStyle(b).minWidth);
b.style.transition = 'none';
b.style.minWidth = '';
getComputedStyle(b).minWidth;
b.style.transition = 'min-width 100s linear -60s allow-discrete';
b.style.minWidth = '40px';
log('discrete after half', getComputedStyle(b).minWidth);

const c = document.getElementById('c');
getComputedStyle(c).paddingLeft;
c.style.transition = 'padding-left 100s linear -50s';
c.style.paddingLeft = '50%';
log('px to percent', c.style.paddingLeft, getComputedStyle(c).paddingLeft);
</script>
