<!DOCTYPE html>
<title>Forty frames</title>
<p id="out"></p>
<script>
let loaded = 0;
for (let i = 0; i < 40; i++) {
  const frame = document.createElement('iframe');
  frame.srcdoc = '<p>frame ' + i + '</p>';
  frame.onload = () => {
    loaded += frame.contentDocument.querySelector('p').textContent === 'frame ' + i ? 1 : 0;
    document.getElementById('out').textContent = loaded + ' of 40 frames loaded';
  };
  document.body.append(frame);
}
</script>
