<!DOCTYPE html>
<title>transform, rotate, scale and translate in the style attribute</title>
<div id="a"></div><pre id="out"></pre><script>
const s=document.getElementById('a').style; const out=[];
for (const [p,v] of [['transform','scale(250%)'],['transform','rotate(0)'],['transform','translate(10px, 5%) rotate(0.5turn)'],['transform','none scale(2)'],['transform','matrix(1, 2)'],['transform','translate(calc(100% - 10px), 2em)'],['transform','perspective(1000)'],['transform','matrix(1,0,0,1,0.123456,0)'],['transform','translateX(0)'],['rotate','400grad x'],['rotate','100px'],['scale','100% 200% 1'],['translate','100px 0px'],['translate','100deg'],['transform','var(--t)'],['transform','scaleX(2), scaleY(3)']]) { s.cssText=''; s[p]=v; out.push(p+': '+v+' -> ['+s[p]+']'); }
document.getElementById('out').textContent=out.join('\n');
</script>
