<!doctype html>
<body>
<div id="banner"></div>
<div id="config"></div>
<div id="init"></div>
<div id="later"></div>
<form name="login"><input name="user"><input type="radio" name="plan" value="free"><input type="radio" name="plan" value="pro" checked><input type="image" name="go"></form>
<img name="logo"><img name="logo">
<iframe name="side" srcdoc="<p>side</p>"></iframe>
<pre id="out"></pre>
<script>
var config = { theme: 'dark' };
function init() { return 'init ran'; }
let later = 'let wins';
const lines = [
  'element by id: ' + banner.localName + ' ' + (window.banner === document.getElementById('banner')),
  'var beats id: ' + config.theme,
  'function beats id: ' + init(),
  'let beats id: ' + later,
  'form by name: ' + login.localName,
  'two images: ' + logo.length,
  'frame by name: ' + (side === document.querySelector('iframe').contentWindow),
  'missing: ' + typeof nothingHere + ' ' + ('nothingHere' in window),
  'real globals: ' + typeof setTimeout + ' ' + typeof addEventListener,
  'elements: ' + login.elements.length + ' ' + login.length + ' ' + login[0].name + ' ' + login.user.name,
  'radio value: ' + login.elements.plan.value + ' ' + (login.elements.namedItem('plan') instanceof RadioNodeList),
  'image excluded: ' + login.go,
];
document.getElementById('out').textContent = lines.join('\n');
</script>
