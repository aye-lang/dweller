<!doctype html><title>Staged scripts</title>
<link rel="stylesheet" href="/delay/50/perf/staged_scripts.css">
<p>Eight inline scripts of 100 ms each after one external script that takes 200 ms to arrive: the page can be shown before any of them ran.</p>
<pre id="log">ran:</pre>
<script src="/delay/200/perf/staged_scripts.js"></script>
<script>(function () { const t = performance.now(); while (performance.now() - t < 100) {} document.getElementById("log").textContent += " 0"; })();</script>
<script>(function () { const t = performance.now(); while (performance.now() - t < 100) {} document.getElementById("log").textContent += " 1"; })();</script>

<script>(function () { const t = performance.now(); while (performance.now() - t < 100) {} document.getElementById("log").textContent += " 5"; })();</script>
<script>(function () { const t = performance.now(); while (performance.now() - t < 100) {} document.getElementById("log").textContent += " 6"; })();</script>
