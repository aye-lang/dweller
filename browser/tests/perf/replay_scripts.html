<!doctype html><title>Replayed scripts</title>
<link rel="stylesheet" href="staged_scripts.css">
<p>An external script and six inline scripts of 100 ms each, replayed from an archive: a wheel sent once the page is shown is handled between two of them.</p>
<pre id="log">ran:</pre>
<pre id="wheel">wheel: none</pre>
<script src="replay_scripts.js"></script>
<script>(function () { const t = performance.now(); while (performance.now() - t < 100) {} document.getElementById("log").textContent += " 0"; })();</script>
<script>(function () { const t = performance.now(); while (performance.now() - t < 100) {} document.getElementById("log").textContent += " 1"; })();</script>
<script>(function () { const t = performance.now(); while (performance.now() - t < 100) {} document.getElementById("log").textContent += " 2"; })();</script>
<script>(function () { const t = performance.now(); while (performance.now() - t < 100) {} document.getElementById("log").textContent += " 3"; })();</script>
<script>(function () { const t = performance.now(); while (performance.now() - t < 100) {} document.getElementById("log").textContent += " 4"; })();</script>
<script>(function () { const t = performance.now(); while (performance.now() - t < 100) {} document.getElementById("log").textContent += " 5"; })();</script>
