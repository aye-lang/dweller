<!doctype html><title>Large body</title>
<p>A 16 MiB response: the page has its body in a fraction of a second, whichever process it runs in.</p>
<pre id="log">waiting</pre>
<script>
const began = performance.now();

fetch("/big?16").then(response => response.arrayBuffer()).then(body => {
  document.getElementById("log").textContent = `body ${body.byteLength} bytes in ${Math.round(performance.now() - began)} ms`;
});
</script>
