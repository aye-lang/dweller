<!doctype html><title>Frame</title><canvas id="c" width="300" height="120"></canvas><script>
const g = document.getElementById("c").getContext("2d");
let t = 0;
function step() {
  g.fillStyle = "#123";
  g.fillRect(0, 0, 300, 120);
  g.fillStyle = "#4a8";
  g.beginPath();
  g.arc(150 + 80 * Math.sin(t / 20), 60, 30, 0, 6.28);
  g.fill();
  t++;
  requestAnimationFrame(step);
}
if (location.hash == "#live") requestAnimationFrame(step);
</script>
