<!doctype html><title>Canvas drawImage</title><body style="margin:0"><canvas id="c" width="800" height="600"></canvas>
<img id="i" src="canvas_drawimage.png" width="128" height="128" style="display:none">
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d'), img = document.getElementById('i');
let t = 0;
function tick() {
  t++;
  g.clearRect(0, 0, 800, 600);
  for (let k = 0; k < 6; k++) {
    g.drawImage(img, 20 + k * 120 + (t % 7), 20, 100, 100);
    g.drawImage(img, 20 + k * 120, 130 + (t % 5), 160, 160);
  }
  g.globalAlpha = 0.5;
  g.drawImage(img, 30, 320, 128, 128);
  g.drawImage(img, 200, 320, 300, 200);
  g.globalAlpha = 1;
  g.save();
  g.translate(600, 400);
  g.rotate(t / 20);
  g.drawImage(img, -60, -60, 120, 120);
  g.restore();
  g.fillStyle = '#c64';
  for (let k = 0; k < 4; k++) {
    g.beginPath();
    g.moveTo(520 + k * 60, 330);
    g.lineTo(560 + k * 60, 330 + (t % 9));
    g.lineTo(540 + k * 60, 380);
    g.closePath();
    g.fill();
    g.beginPath();
    g.arc(540 + k * 60, 450, 25, 0, 6.28);
    g.fill();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
