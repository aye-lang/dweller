<!doctype html>
<style>
body { margin: 0 }
p { margin: 4px 8px }
</style>
<p>rows of text so the display list has items</p>
<canvas id="c" width="400" height="200"></canvas>
<iframe srcdoc="<body style='margin:0'><canvas id=d width=300 height=120></canvas><script>let k = 0; const g = document.getElementById('d').getContext('2d'); function tick() { k += 1; g.fillStyle = 'rgb(' + (k % 256) + ',40,160)'; g.fillRect((k * 7) % 280, 20, 20, 20); requestAnimationFrame(tick) } requestAnimationFrame(tick)</script></body>" width="320" height="140"></iframe>
<script>
const g = document.getElementById("c").getContext("2d");
let k = 0;
function tick() {
  k += 1;
  g.fillStyle = "rgb(200," + (k % 256) + ",40)";
  g.fillRect((k * 5) % 380, 30, 20, 20);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
