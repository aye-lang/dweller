<!doctype html>
<a id=link>link</a>
<script>
const [how, dir] = location.search.slice(1).split('&')
const secret = decodeURIComponent(dir) + 'secret.html'
link.href = secret
if (how == 'location') location = secret
if (how == 'open') link.onclick = e => { e.preventDefault(); window.open(secret) }
</script>
