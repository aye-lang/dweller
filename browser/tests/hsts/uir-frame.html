<!doctype html>
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<title>UIR frame</title>
<pre id="out"></pre>
<script>
window.onmessage = e => { document.getElementById('out').textContent += e.data + '\n'; };
const f = document.createElement('iframe');
f.src = 'http://site.test:' + location.port + '/uir-inner.html';
document.body.appendChild(f);
</script>
