<!doctype html>
<title>Upgraded images</title>
<p>text first</p>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
let loaded = 0;
for (const n of [1, 2, 3]) {
  const i = document.createElement('img');
  i.onload = () => { loaded += 1; if (loaded === 3) out.textContent += 'images: 3 loaded\n'; };
  i.onerror = () => { out.textContent += 'img ' + n + ': error\n'; };
  i.src = 'http://site.test:' + location.port + '/slow.gif?' + n;
  document.body.appendChild(i);
}
</script>
