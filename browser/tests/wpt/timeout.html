<!doctype html>
<title>a subtest that never finishes</title>
<script src="resources/testharness.js"></script>
<script src="../../tools/wpt/testharnessreport.js"></script>
<script>
test(function () {
    assert_true(true);
}, "finishes");
async_test(function (t) {
    // Never done: the runner's timeout ends it.
}, "never finishes");
</script>
