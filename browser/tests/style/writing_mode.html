<!DOCTYPE html>
<style>
.v { writing-mode: vertical-rl; text-orientation: upright }
.svg { writing-mode: tb }
.webkit { -webkit-writing-mode: vertical-lr }
.bad { writing-mode: vertical-rl horizontal-tb; text-combine-upright: digits 5 }
.tcy { text-combine-upright: digits; unicode-bidi: isolate-override }
.side { text-orientation: sideways-right; text-combine-upright: digits calc(1 + 2) }
</style>
<div class="v">vertical-rl, upright <span>inherited</span></div>
<p class="svg">tb is vertical-rl</p>
<p class="webkit">vertical-lr</p>
<p class="bad">invalid: horizontal-tb, none</p>
<p class="tcy">digits 2 <b>inherited, unicode-bidi normal</b></p>
<p class="side">sideways, digits 3</p>
