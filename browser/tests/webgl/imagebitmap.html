<!doctype html>
<title>createImageBitmap sources and options</title>
<canvas id="c" width="4" height="4"></canvas>
<pre id="out"></pre>
<script>
// P11.6b: createImageBitmap(source[, sx, sy, sw, sh][, options]) from a
// Blob (fetched PNG), an ImageData and the canvas sources; the crop
// rectangle, imageOrientation, premultiplyAlpha, the resize options and
// close(); their pixels read back through a 2D canvas, and a Blob bitmap
// uploaded with texImage2D. bitmap3x2.png is 3x2: red, green, blue over
// (200,100,50,128), yellow, cyan.
const lines = [];
const log = (...a) => lines.push(a.map(String).join(' '));
// The pixels of a bitmap (or any 2D source), row by row, via drawImage.
function pixels(source, w = source.width, h = source.height) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(source, 0, 0);
  const d = ctx.getImageData(0, 0, w, h).data;
  const rows = [];
  for (let y = 0; y < h; y++) {
    const row = [];
    for (let x = 0; x < w; x++) row.push(Array.from(d.subarray((y * w + x) * 4, (y * w + x) * 4 + 4)).join(','));
    rows.push(row.join(' '));
  }
  return rows.join(' / ');
}
const show = (label, b) => log(label, b.width + 'x' + b.height, pixels(b));
const fails = (label, p) => p.then(() => log(label, 'resolved'), e => log(label, e.name));

const gl = document.getElementById('c').getContext('webgl2', {antialias: false});
function program() {
  const make = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, make(gl.VERTEX_SHADER, `#version 300 es
out vec2 uv;
void main() {
  vec2 p = vec2(float(gl_VertexID & 1), float(gl_VertexID >> 1));
  uv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`));
  gl.attachShader(p, make(gl.FRAGMENT_SHADER, `#version 300 es
precision mediump float;
uniform sampler2D tex;
in vec2 uv;
out vec4 frag;
void main() {
  frag = texture(tex, uv);
}`));
  gl.linkProgram(p);
  gl.useProgram(p);
}
// Uploads the bitmap as a NEAREST texture and logs the corner pixels:
// bottom left, bottom right, top left, top right of the 4x4 canvas.
function upload(label, bitmap) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, bitmap);
  const error = gl.getError();
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  const px = new Uint8Array(4 * 4 * 4);
  gl.readPixels(0, 0, 4, 4, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const at = (x, y) => Array.from(px.subarray((y * 4 + x) * 4, (y * 4 + x) * 4 + 4)).join(',');
  log(label, 'BL', at(0, 0), 'BR', at(3, 0), 'TL', at(0, 3), 'TR', at(3, 3), 'error', error, gl.getError());
}

async function run() {
  const blob = await fetch('bitmap3x2.png').then(r => r.blob());
  log('blob', blob.size > 0, blob.type);

  // Sources.
  const plain = await createImageBitmap(blob);
  log('is an ImageBitmap', plain instanceof ImageBitmap);
  show('blob', plain);
  const three = await createImageBitmap(blob, {premultiplyAlpha: 'none', colorSpaceConversion: 'none', imageOrientation: 'flipY'});
  show('blob as three.js (flipY)', three);
  const data = new ImageData(new Uint8ClampedArray([1, 2, 3, 255, 4, 5, 6, 255, 7, 8, 9, 255, 10, 11, 12, 255]), 2, 2);
  show('ImageData', await createImageBitmap(data));
  show('ImageData flipY', await createImageBitmap(data, {imageOrientation: 'flipY'}));
  data.data[0] = 99;
  show('ImageData is copied', await createImageBitmap(data));
  const canvas = document.createElement('canvas');
  canvas.width = 2;
  canvas.height = 1;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(0, 0, 1, 1);
  show('canvas', await createImageBitmap(canvas));
  show('OffscreenCanvas', await createImageBitmap(new OffscreenCanvas(1, 1)));
  show('ImageBitmap', await createImageBitmap(plain, {imageOrientation: 'flipY'}));
  const img = new Image();
  img.src = 'bitmap3x2.png';
  await img.decode();
  show('image', await createImageBitmap(img));

  // The crop rectangle.
  show('crop 1,0,2,2', await createImageBitmap(blob, 1, 0, 2, 2));
  show('crop 2,1,-2,-1 (negative sizes move the origin)', await createImageBitmap(blob, 2, 1, -2, -1));
  show('crop -1,-1,3,3 (outside is transparent)', await createImageBitmap(blob, -1, -1, 3, 3));
  show('crop 2,0,5,5 (cut at the edge)', await createImageBitmap(blob, 2, 0, 5, 5));
  show('crop 5,5,2,2 (all outside)', await createImageBitmap(blob, 5, 5, 2, 2));
  show('crop with flipY', await createImageBitmap(blob, 0, 0, 2, 2, {imageOrientation: 'flipY'}));
  show('crop of ImageData', await createImageBitmap(data, 1, 1, 1, 1));
  await fails('crop width 0', createImageBitmap(blob, 0, 0, 0, 1));
  await fails('crop height 0', createImageBitmap(blob, 0, 0, 1, 0));
  await fails('crop with 3 numbers', createImageBitmap(blob, 0, 0, 1));

  // Resizing.
  show('resize 6x4 pixelated', await createImageBitmap(blob, {resizeWidth: 6, resizeHeight: 4, resizeQuality: 'pixelated'}));
  show('resizeWidth 6', await createImageBitmap(blob, {resizeWidth: 6, resizeQuality: 'pixelated'}));
  show('resizeHeight 4', await createImageBitmap(blob, {resizeHeight: 4, resizeQuality: 'pixelated'}));
  show('crop and resize', await createImageBitmap(blob, 1, 0, 2, 1, {resizeWidth: 4, resizeHeight: 2, resizeQuality: 'pixelated'}));
  await fails('resizeWidth 0', createImageBitmap(blob, {resizeWidth: 0}));
  await fails('resizeHeight 0', createImageBitmap(blob, {resizeHeight: 0}));

  // Options and errors.
  for (const options of [{imageOrientation: 'flip'}, {premultiplyAlpha: 'yes'}, {colorSpaceConversion: 'srgb'}, {resizeQuality: 'best'}]) {
    await fails('options ' + JSON.stringify(options), createImageBitmap(blob, options));
  }
  for (const options of [{imageOrientation: 'from-image'}, {imageOrientation: 'none'}, {premultiplyAlpha: 'premultiply'}, {premultiplyAlpha: 'default'}, {colorSpaceConversion: 'default'}]) {
    await fails('options ' + JSON.stringify(options), createImageBitmap(blob, options));
  }
  await fails('Blob of text', createImageBitmap(new Blob(['not an image'], {type: 'image/png'})));
  await fails('empty Blob', createImageBitmap(new Blob([])));
  await fails('truncated PNG', createImageBitmap(blob.slice(0, 40, 'image/png')));
  await fails('not a source', createImageBitmap({}));
  await fails('no argument', createImageBitmap());
  const empty = document.createElement('canvas');
  empty.width = 0;
  await fails('empty canvas', createImageBitmap(empty));
  await fails('image that is not loaded', createImageBitmap(new Image()));

  // close().
  const closing = await createImageBitmap(blob);
  closing.close();
  log('closed', closing.width, closing.height);
  closing.close();
  await fails('closed bitmap as a source', createImageBitmap(closing));

  // WebGL: a Blob bitmap uploaded with texImage2D (the pixel store flags
  // do not apply to it). 'none' keeps (200,100,50,128), 'premultiply' and
  // 'default' have it premultiplied.
  if (!gl) {
    log('webgl2 null');
    return;
  }
  program();
  upload('texImage2D none', await createImageBitmap(blob, 0, 0, 2, 2, {premultiplyAlpha: 'none'}));
  upload('texImage2D none flipY', await createImageBitmap(blob, 0, 0, 2, 2, {premultiplyAlpha: 'none', imageOrientation: 'flipY'}));
  upload('texImage2D premultiply', await createImageBitmap(blob, 0, 0, 2, 2, {premultiplyAlpha: 'premultiply'}));
  upload('texImage2D default flipY', await createImageBitmap(blob, 0, 0, 2, 2, {imageOrientation: 'flipY'}));
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  upload('texImage2D none, UNPACK_FLIP_Y ignored', await createImageBitmap(blob, 0, 0, 2, 2, {premultiplyAlpha: 'none'}));
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  upload('texImage2D ImageData bitmap', await createImageBitmap(new ImageData(new Uint8ClampedArray([10, 20, 30, 255, 40, 50, 60, 255, 70, 80, 90, 255, 100, 110, 120, 255]), 2, 2), {premultiplyAlpha: 'none'}));
  const gone = await createImageBitmap(blob, 0, 0, 2, 2);
  gone.close();
  upload('texImage2D closed bitmap', gone);
}
run().catch(e => log('exception', e && e.stack ? e.stack : e)).then(() => {
  document.getElementById('out').textContent = lines.join('\n');
});
</script>
