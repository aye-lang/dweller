<!doctype html>
<title>WebGL 2 spinning triangle</title>
<style>body { margin: 0; background: #fff; } canvas { display: block; }</style>
<canvas id="c" width="1280" height="720"></canvas>
<p>A triangle turns in 120 animation frames.</p>
<script>
// P11.7: a 1280x720 canvas drawn in 120 animation frames, each a triangle
// turned a little further on dark gray; the rest of the page never
// changes (window_webgl).
const gl = document.getElementById('c').getContext('webgl2');
const vs = `#version 300 es
in vec2 pos;
in vec3 color;
uniform float angle;
out vec3 v_color;
void main() {
  v_color = color;
  float c = cos(angle);
  float s = sin(angle);
  gl_Position = vec4(c * pos.x - s * pos.y, (s * pos.x + c * pos.y) * 16.0 / 9.0, 0.0, 1.0);
}`;
const fs = `#version 300 es
precision mediump float;
in vec3 v_color;
out vec4 frag;
void main() {
  frag = vec4(v_color, 1.0);
}`;
function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
  0.0, 0.5, 1, 0, 0,
  -0.43, -0.25, 0, 1, 0,
  0.43, -0.25, 0, 0, 1,
]), gl.STATIC_DRAW);
const pos = gl.getAttribLocation(prog, 'pos');
const color = gl.getAttribLocation(prog, 'color');
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 20, 0);
gl.enableVertexAttribArray(color);
gl.vertexAttribPointer(color, 3, gl.FLOAT, false, 20, 8);
const angle = gl.getUniformLocation(prog, 'angle');
gl.clearColor(0.2, 0.2, 0.2, 1);
let frame = 0;
function draw() {
  frame++;
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(angle, frame * Math.PI / 60);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (frame < 120) requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
