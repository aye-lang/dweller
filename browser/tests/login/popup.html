<!doctype html>
<title>Popup</title>
<p id="out">popup</p>
<script>
// An OAuth-style popup: it hands its result to the page that opened it
// and closes (P4.52).
if (window.opener) {
  window.opener.postMessage({ login: "alice" }, "*");
  document.getElementById("out").textContent = "posted";
  window.close();
} else {
  document.getElementById("out").textContent = "no opener";
}
</script>
