<!doctype html>
<title>Opener</title>
<p id="out">waiting</p>
<button id="go" style="position:absolute;left:10px;top:10px;width:100px;height:30px">Sign in</button>
<script>
// Opens popup.html on a click and shows what it posts back (P4.52).
window.addEventListener("message", function (e) {
  document.getElementById("out").textContent = "message: " + e.data.login;
});
document.getElementById("go").addEventListener("click", function () {
  window.open("popup.html", "login", "width=400,height=300");
});
</script>
