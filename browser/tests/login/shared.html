<!doctype html>
<title>Shared</title>
<p id="seen">no script</p>
<pre id="headers"></pre>
<script>
document.getElementById("seen").textContent = "token: " + localStorage.getItem("token") + "; cookie: " + document.cookie;
document.cookie = "person=1; Path=/";
localStorage.setItem("from", "person");
fetch("/headers").then(r => r.text()).then(t => {
  document.getElementById("headers").textContent = t;
  document.title = "Shared done";
});
</script>
