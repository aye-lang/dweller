<!doctype html>
<body style="margin:0">
<img id="i" src="cap_large.jpg">
<p id="out"></p>
<script>
addEventListener('load', () => {
const i = document.getElementById('i');
const c = document.createElement('canvas');
c.width = 4;
c.height = 4;
const g = c.getContext('2d');
g.drawImage(i, 0, 0, 4, 4);
const r = i.getBoundingClientRect();
document.getElementById('out').textContent = 'natural ' + i.naturalWidth + 'x' + i.naturalHeight + ' width ' + i.width + 'x' + i.height + ' box ' + r.width + 'x' + r.height + ' drawn ' + g.getImageData(1, 1, 1, 1).data.join(',');
});
</script>
