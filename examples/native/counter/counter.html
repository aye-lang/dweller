<!doctype html>
<meta charset="utf-8">
<title>Counter</title>
<link rel="stylesheet" href="counter.css">
<h1>Counter</h1>
<p id="count">0</p>
<button id="inc">+1</button><button id="reset">Reset</button>
<div class="add"><input id="name"><button id="add">Add</button></div>
<div id="list"></div>
<script>
var count = 0;
var list = document.getElementById("list");
function row(label) {
  var el = document.createElement("div");
  el.className = "row";
  el.textContent = label;
  list.appendChild(el);
  return el;
}
function show() { document.getElementById("count").textContent = String(count); }
for (var i = 1; i <= 1000; i++) row("Row " + i);
document.getElementById("inc").onclick = function () { count += 1; show(); };
document.getElementById("reset").onclick = function () { count = 0; show(); };
document.getElementById("add").onclick = function () {
  var name = document.getElementById("name");
  row(name.value).className = "row added";
  name.value = "";
};
</script>
